name: tinytube

# Catches a broken TinyTube on the pull request rather than on main, where the
# same failure would stop `pages` and take the landing page and the APK
# download with it — the two share one Pages deployment.
#
# Deliberately NOT in auto-merge.yml's REQUIRED list: this workflow is
# path-filtered, and a filtered-out workflow produces no check run at all
# (not a skipped one), which that list reads as "still queued" forever.
on:
  push:
    branches: [ "main" ]
    paths:
      - "tinytube/**"
      - ".github/workflows/tinytube.yml"
  pull_request:
    paths:
      - "tinytube/**"
      - ".github/workflows/tinytube.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tinytube-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tinytube:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tinytube
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tinytube/package-lock.json

      - run: npm ci

      - run: npm test

      # No YOUTUBE_API_KEY here on purpose — the build must not need one, and
      # videos.json is fetched at runtime rather than bundled. This only proves
      # the SPA still compiles; `pages` does the real, data-carrying build.
      - name: Build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/tinytube/
        run: npm run build
