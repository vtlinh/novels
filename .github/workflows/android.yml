name: android

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p android assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: novel-downloader-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # main builds publish to a fixed release so the web page's
      # "Download Android app" button always has a stable public URL
      - name: Publish APK to the android-latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create android-latest --repo "$GITHUB_REPOSITORY" \
              --title "Android app (latest)" --notes "Debug APK auto-built from main." --latest=false
          gh release upload android-latest --repo "$GITHUB_REPOSITORY" --clobber \
            android/app/build/outputs/apk/debug/app-debug.apk
