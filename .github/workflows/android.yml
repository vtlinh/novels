name: android

on:
  push:
    # main only. Feature-branch pushes built too, and since those runs share
    # the concurrency group with main's, syncing a branch after a merge queued
    # a second run that superseded — and cancelled — the pending main run
    # before it could publish. Branch builds never published anyway (the
    # release step is gated on main), so they were pure waste.
    branches: [ "main" ]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

# Only one publish at a time: two overlapping runs both clobber the fixed
# android-latest release, so a slower older run can land its APK on top of a
# newer one's version.json. Runs QUEUE rather than cancel — every merge here
# is meant to ship, and cancelling one drops its build on the floor (that's
# how #258's APK was never published).
concurrency:
  group: android-latest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Version name = "<year>.<week>.<patch>":
      #   year  — years since 2025, 1-indexed (2026 -> 1)
      #   week  — ISO week of the year, 1-indexed (matched to the ISO year)
      #   patch — running build within that week; restarts at 1 the first
      #           build of a new week, otherwise the previous published
      #           patch + 1 (read back from the android-latest version.json)
      # The versionCode (GITHUB_RUN_NUMBER, set in build.gradle.kts) is what
      # the in-app updater compares, so this string is display-only and may
      # reset freely.
      - name: Compute version name
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          YEAR=$(( $(date -u +%G) - 2025 ))
          WEEK=$(( 10#$(date -u +%V) ))
          PATCH=1
          if gh release download android-latest --repo "$GITHUB_REPOSITORY" \
               --pattern version.json --output prev.json --clobber 2>/dev/null; then
            PREV=$(sed -n 's/.*"versionName"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' prev.json)
            PY=${PREV%%.*}; REST=${PREV#*.}; PW=${REST%%.*}; PP=${REST##*.}
            if [ "$PY" = "$YEAR" ] && [ "$PW" = "$WEEK" ] && [ -n "$PP" ]; then
              PATCH=$(( PP + 1 ))
            fi
            rm -f prev.json
          fi
          echo "APP_VERSION_NAME=${YEAR}.${WEEK}.${PATCH}" >> "$GITHUB_ENV"
          echo "Computed version name: ${YEAR}.${WEEK}.${PATCH}"

      - name: Build release APK
        run: gradle -p android assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: novel-downloader-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      # main builds publish to a fixed release so the web page's
      # "Download Android app" button always has a stable public URL
      - name: Publish APK to the android-latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "{\"versionCode\": ${GITHUB_RUN_NUMBER}, \"versionName\": \"${APP_VERSION_NAME}\"}" > version.json
          gh release view android-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create android-latest --repo "$GITHUB_REPOSITORY" \
              --title "Android app (latest)" --notes "APK auto-built from main." --latest=false
          # app-debug.apk is a legacy alias: updaters installed before the
          # switch to release builds still download that fixed filename
          cp android/app/build/outputs/apk/release/app-release.apk app-debug.apk
          gh release upload android-latest --repo "$GITHUB_REPOSITORY" --clobber \
            android/app/build/outputs/apk/release/app-release.apk app-debug.apk version.json
