<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Novel Downloader</title>
<style>
  :root { --bg:#111418; --card:#1b2026; --fg:#e8eaed; --muted:#9aa0a6;
          --accent:#4f8cff; --ok:#3ddc84; --err:#ff6b6b; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--bg);
         color:var(--fg); display:flex; justify-content:center; padding:32px 16px; }
  main { width:100%; max-width:680px; }
  h1 { font-size:22px; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 24px; font-size:13px; }
  .card { background:var(--card); border-radius:12px; padding:20px; margin-bottom:16px; }
  label { display:block; font-size:12px; color:var(--muted); margin:12px 0 4px; }
  label:first-child { margin-top:0; }
  input { width:100%; padding:10px 12px; border-radius:8px; border:1px solid #333a42;
          background:#12161b; color:var(--fg); font-size:14px; }
  input:focus { outline:none; border-color:var(--accent); }
  input[type="range"] { padding:0; border:none; background:none;
                        accent-color:var(--accent); }
  label.check { display:flex; align-items:center; gap:8px; margin-top:16px;
                color:var(--fg); font-size:14px; cursor:pointer; }
  label.check input { width:auto; accent-color:var(--accent); }
  #tr-opts { display:none; }
  button { margin-top:16px; padding:11px 18px; border:none; border-radius:8px;
           font-size:14px; font-weight:600; cursor:pointer; }
  #btn-folder { background:var(--accent); color:#fff; margin-right:8px; }
  #btn-zip { background:#2a313a; color:var(--fg); margin-right:8px; }
  #btn-stop { background:var(--err); color:#fff; display:none; }
  #btn-restart { background:var(--accent); color:#fff; display:none; margin-right:8px; }
  #btn-retry { background:#e0a33e; color:#1b2026; display:none; margin-right:8px; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  #status { font-size:13px; color:var(--muted); margin-top:14px; min-height:18px; }
  progress { width:100%; height:8px; margin-top:10px; accent-color:var(--accent);
             display:none; }
  #log { font:12px/1.6 ui-monospace, monospace; background:#0d1013; border-radius:8px;
         padding:12px; margin-top:12px; max-height:260px; overflow-y:auto;
         white-space:pre-wrap; display:none; }
  .ok { color:var(--ok); } .err { color:var(--err); }
  p.hint { color:var(--muted); font-size:12px; margin:16px 0 0; }
  p.hint code { word-break:break-all; }
</style>
</head>
<body>
<main>
  <h1>Novel Downloader</h1>
  <p class="sub">Downloads every chapter of a truyenfull or novelfull novel as text files. <span id="ver"></span></p>

  <div class="card">
    <label for="url">Novel URL</label>
    <input id="url" type="url" placeholder="https://novelfull.com/god-of-crime.html" spellcheck="false">
    <label for="conc">Simultaneous downloads: <span id="conc-val">10</span></label>
    <input id="conc" type="range" min="1" max="50" value="10">
    <label class="check"><input type="checkbox" id="translate"> Translate to English (Claude)</label>
    <div id="tr-opts">
      <label for="apikey">Anthropic API key (kept in this browser only)</label>
      <input id="apikey" type="password" placeholder="sk-ant-..." spellcheck="false">
    </div>
    <p class="hint">For the @Voice app, use the <code>/storage/emulated/0/Android/data/com.hyperionics.avar/files</code> folder.</p>
    <button id="btn-folder">Download to folder…</button>
    <button id="btn-zip">Download as ZIP</button>
    <button id="btn-stop">Stop</button>
    <button id="btn-restart">Restart</button>
    <button id="btn-retry">Retry failed</button>
    <div id="status"></div>
    <progress id="bar" max="1" value="0"></progress>
    <div id="log"></div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"
        integrity="sha512-XMVd28F1oH/O71fzwBnV7HucLxVwtxf26XV8P4wPk26EDxuGZ91N8bsOttmnomcCD3CS5ZMRL50H0GgOHvegtg=="
        crossorigin="anonymous"></script>
<script>
"use strict";

const VERSION = "1.41";
const $ = id => document.getElementById(id);
const statusEl = $("status"), logEl = $("log"), bar = $("bar");
$("ver").textContent = `v${VERSION}`;

const PROXY = "https://truyenfull.vtlinh87.workers.dev";

/* remember settings between visits */
$("url").value = localStorage.getItem("url") || "";
$("url").addEventListener("input", e => localStorage.setItem("url", e.target.value.trim()));
$("conc").value = localStorage.getItem("conc") || "10";
$("conc-val").textContent = $("conc").value;
$("conc").addEventListener("input", e => {
  $("conc-val").textContent = e.target.value;
  localStorage.setItem("conc", e.target.value);
});
$("translate").checked = localStorage.getItem("translate") === "1";
$("apikey").value = localStorage.getItem("apikey") || "";
const syncTrOpts = () => { $("tr-opts").style.display = $("translate").checked ? "block" : "none"; };
$("translate").addEventListener("change", e => {
  localStorage.setItem("translate", e.target.checked ? "1" : "0");
  syncTrOpts();
});
$("apikey").addEventListener("change", e => localStorage.setItem("apikey", e.target.value.trim()));
syncTrOpts();

/* ---------------- site adapters ----------------
   Each supported site knows how to turn a novel URL into a listing base +
   slug, page through its chapter listing, recognise chapter links, and pull a
   chapter number out of a chapter URL. Everything downstream (fetching,
   extraction, saving) is shared. `headingWord` is the language of the chapter
   heading the site uses, so saved files read naturally ("Chương 5" vs
   "Chapter 5"). */
const SITES = [
  {
    name: "truyenfull",
    urlRe: /^https:\/\/truyenfull\.(today|live)(\/|$)/i,
    headingWord: "Chương",
    /* /ten-truyen/ -> base "…/ten-truyen/", slug "ten-truyen" */
    normalize(novelUrl) {
      const base = novelUrl.replace(/\/+$/, "") + "/";
      return { base, slug: new URL(base).pathname.replace(/^\/|\/$/g, "").split("/")[0] };
    },
    listPageUrl(base, slug, p) { return `${base}trang-${p}/`; },
    isChapterPath(path, slug) { return path.includes(`/${slug}/`) && /chuong-\d+/.test(path); },
    maxPage(doc, slug) {
      let max = 1;
      const re = new RegExp(`/${slug}/trang-(\\d+)`);
      for (const a of doc.querySelectorAll("a[href]")) {
        const m = (a.getAttribute("href") || "").match(re);
        if (m) max = Math.max(max, parseInt(m[1], 10));
      }
      return max;
    },
    chapterNumFromUrl(url) {
      const m = url.match(/chuong-(\d+)/g);
      return m ? parseInt(m[m.length - 1].slice(7), 10) : null;
    },
  },
  {
    name: "novelfull",
    urlRe: /^https:\/\/novelfull\.com\//i,
    headingWord: "Chapter",
    /* /god-of-crime.html -> base "…/god-of-crime.html", slug "god-of-crime".
       Listing pages are the same URL with a ?page=N query string. */
    normalize(novelUrl) {
      const u = new URL(novelUrl);
      const slug = u.pathname.replace(/^\/+/, "").replace(/\.html?$/i, "").split("/")[0];
      return { base: `${u.origin}/${slug}.html`, slug };
    },
    listPageUrl(base, slug, p) { return `${base}?page=${p}`; },
    isChapterPath(path, slug) { return path.includes(`/${slug}/`) && /chapter-\d+/i.test(path); },
    /* Yii2 LinkPager: every page link carries a 1-based ?page=N, and the
       "Last »" link's href holds the true final page number. */
    maxPage(doc) {
      let max = 1;
      for (const a of doc.querySelectorAll("a[href]")) {
        const m = (a.getAttribute("href") || "").match(/[?&]page=(\d+)/);
        if (m) max = Math.max(max, parseInt(m[1], 10));
      }
      return max;
    },
    chapterNumFromUrl(url) {
      const m = url.match(/chapter-(\d+)/ig);
      return m ? parseInt(m[m.length - 1].replace(/chapter-/i, ""), 10) : null;
    },
  },
];
const siteFor = url => SITES.find(s => s.urlRe.test((url || "").trim()));
let SITE = null;   // the adapter for the URL of the current/most recent run

let running = false;
let stopRequested = false;
let aborter = null;
let lastRun = null;      // {makeSink, root} of the current/most recent run
let wasStopped = false;  // last run ended via the Stop button
let lastFailed = null;   // {makeSink, root, title, chapters} of chapters that failed to download

/* keep the screen awake during a run so mobile Chrome doesn't freeze the tab;
   the lock is dropped when the tab hides, so re-acquire when it's visible again */
let wakeLock = null;
async function acquireWakeLock() {
  try { wakeLock = await navigator.wakeLock?.request("screen"); } catch {}
}
function releaseWakeLock() {
  try { wakeLock?.release(); } catch {}
  wakeLock = null;
}
document.addEventListener("visibilitychange", () => {
  if (running && document.visibilityState === "visible") acquireWakeLock();
});

/* warn before navigating away / closing the tab while a run is in progress
   (browsers show their own generic "Leave site?" dialog) */
window.addEventListener("beforeunload", e => {
  if (!running) return;
  e.preventDefault();
  e.returnValue = "";   // required by Chrome to trigger the dialog
});

class StopError extends Error {
  constructor() { super("stopped by user"); this.stopped = true; }
}
const throwIfStopped = () => { if (stopRequested) throw new StopError(); };
const sleep = ms => new Promise(res => setTimeout(res, ms));
async function sleepUnlessStopped(ms) {
  for (let t = 0; t < ms && !stopRequested; t += 500)
    await sleep(500);
}

if (!window.showDirectoryPicker)
  $("btn-folder").title = "Folder saving needs Chrome or Edge; use ZIP instead.";

function updateButtons() {
  const ok = !!siteFor($("url").value);
  $("btn-folder").disabled = false;   // always enabled
  $("btn-zip").disabled = running || !ok;
  $("btn-stop").style.display = running ? "inline-block" : "none";
  /* a stopped run leaves a Restart button in the Stop button's place — it
     reuses the already-granted folder handle, so no re-picking */
  $("btn-restart").style.display = !running && wasStopped && lastRun ? "inline-block" : "none";
  /* a finished run with download failures offers a Retry that re-fetches only
     those chapters, reusing the same folder handle / sink */
  $("btn-retry").style.display = !running && lastFailed && lastFailed.chapters.length ? "inline-block" : "none";
}
$("url").addEventListener("input", updateButtons);
updateButtons();

$("btn-restart").addEventListener("click", () => {
  if (lastRun && !running) run(lastRun.makeSink, lastRun.root);
});

$("btn-retry").addEventListener("click", () => {
  if (lastFailed && !running)
    run(lastFailed.makeSink, lastFailed.root, { title: lastFailed.title, chapters: lastFailed.chapters });
});

$("btn-stop").addEventListener("click", () => {
  stopRequested = true;
  aborter?.abort();
  $("btn-stop").disabled = true;
  setStatus("Stopping — finishing what's already in flight…");
  log("Stop requested.", "err");
});

function log(msg, cls) {
  logEl.style.display = "block";
  const line = document.createElement("div");
  if (cls) line.className = cls;
  line.textContent = msg;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}
function setStatus(msg) { statusEl.textContent = msg; }
const errMsg = e => (e.name && e.name !== "Error" ? `${e.name}: ` : "") + e.message;

/* ---------------- fetching & parsing ---------------- */

const MAX_RETRIES = 4;

function proxied(url) {
  return `${PROXY}/?url=${encodeURIComponent(url)}`;
}

async function fetchDoc(url) {
  let lastErr;
  for (let i = 0; i < MAX_RETRIES; i++) {
    throwIfStopped();
    try {
      const r = await fetch(proxied(url), { signal: aborter?.signal });
      if (r.ok) {
        const html = await r.text();
        if (html.trim()) return new DOMParser().parseFromString(html, "text/html");
      }
      lastErr = new Error(`HTTP ${r.status}`);
    } catch (e) {
      throwIfStopped();
      lastErr = e;
    }
    await sleepUnlessStopped(1000 * 2 ** i + Math.random() * 1000);
  }
  throw new Error(`failed after ${MAX_RETRIES} attempts: ${url} (${lastErr})`);
}

/* Fetch many chapter URLs in a SINGLE Worker call (up to FETCH_BATCH, the
   free-tier subrequest limit). `concurrency` caps how many requests the
   Worker keeps in flight against the site at once, so we don't hammer
   truyenfull. Returns Map(url -> html) for the ones that came back
   non-empty. Retries the whole call on a network error. */
async function fetchMany(urls, concurrency) {
  let lastErr;
  for (let i = 0; i < MAX_RETRIES; i++) {
    throwIfStopped();
    try {
      const r = await fetch(`${PROXY}/fetch-many`, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ urls, concurrency }),
        signal: aborter?.signal,
      });
      if (r.ok) {
        const { results } = await r.json();
        const map = new Map();
        for (const res of results || []) if (res.ok && res.html && res.html.trim()) map.set(res.url, res.html);
        return map;
      }
      lastErr = new Error(`proxy /fetch-many HTTP ${r.status}`);
    } catch (e) { throwIfStopped(); lastErr = e; }
    await sleepUnlessStopped(1000 * 2 ** i + Math.random() * 1000);
  }
  throw lastErr;
}

/* Cloudflare allows only ~6 simultaneous outgoing connections per Worker
   invocation, so a single /fetch-many call can never fetch more than ~6
   chapters at once no matter what concurrency it's asked for. To honor
   higher slider values, run SEVERAL /fetch-many calls in parallel — each
   invocation gets its own connection budget and its own FETCH_BATCH-sized
   group of chapters. ceil(slider/6) calls run at the full 6 connections
   each, so the real parallelism is the slider rounded up to a multiple of 6
   (e.g. 20 -> 4 calls x 6 = 24 chapters in parallel). `handle(group, conc)`
   fetches and consumes one group; it must not throw. */
const WORKER_CONNS = 6;
async function fetchInPool(groups, concurrency, handle) {
  const calls = Math.max(1, Math.min(groups.length, Math.ceil(concurrency / WORKER_CONNS)));
  const conc = Math.min(WORKER_CONNS, concurrency);
  let next = 0;
  await Promise.all(Array.from({ length: calls }, async () => {
    while (!stopRequested) {
      const g = next++;
      if (g >= groups.length) return;
      await handle(groups[g], conc);
    }
  }));
}

function chapterLinks(doc, base, slug) {
  const seen = new Set(), out = [];
  for (const a of doc.querySelectorAll("a[href]")) {
    let href;
    try { href = new URL(a.getAttribute("href"), base).href.split("#")[0]; }
    catch { continue; }
    const path = new URL(href).pathname;
    if (SITE.isChapterPath(path, slug) && !seen.has(href)) {
      seen.add(href);
      out.push({ url: href, text: a.textContent.trim() });
    }
  }
  return out;
}

async function listAllChapters(novelUrl, concurrency) {
  const { base, slug } = SITE.normalize(novelUrl);
  const doc = await fetchDoc(base);
  const title = doc.querySelector('meta[property="og:title"]')?.content?.trim()
             || doc.querySelector('h3.title[itemprop="name"], h3.title')?.textContent.trim()
             || doc.querySelector("h1")?.textContent.trim() || slug;

  const seen = new Set(), chapters = [];
  const add = items => { for (const c of items) if (!seen.has(c.url)) { seen.add(c.url); chapters.push(c); } };
  const pageUrl = p => SITE.listPageUrl(base, slug, p);

  add(chapterLinks(doc, base, slug));
  let last = SITE.maxPage(doc, slug);

  /* fetch listing pages in batches via one Worker call each, instead of one
     round trip per page — this is what lets the download start quickly on
     long novels. Pages the batch missed fall back to per-page fetching. */
  let fetched = 1;
  while (fetched < last) {
    throwIfStopped();
    const batch = [];
    for (let p = fetched + 1; p <= last && batch.length < FETCH_BATCH; p++) batch.push(p);
    setStatus(`Listing chapters: pages ${batch[0]}-${batch[batch.length - 1]} of ${last}…`);
    const htmls = await fetchMany(batch.map(pageUrl), concurrency);
    for (const p of batch) {
      const html = htmls.get(pageUrl(p));
      const d = html ? new DOMParser().parseFromString(html, "text/html")
                     : await fetchDoc(pageUrl(p));
      add(chapterLinks(d, base, slug));
      last = Math.max(last, SITE.maxPage(d, slug));
    }
    fetched = batch[batch.length - 1];
  }

  for (const ch of chapters) ch.num = SITE.chapterNumFromUrl(ch.url) ?? parseHeading(ch.text).num;
  chapters.sort((a, b) => (a.num ?? 1e9) - (b.num ?? 1e9));

  /* assign filenames once, here: different chapters that map to the same
     number (e.g. two "chapter-12" URLs both -> 12) get a deterministic suffix
     so one doesn't overwrite or shadow the other */
  const counts = new Map();
  for (const ch of chapters) {
    if (ch.num == null) { ch.filename = null; continue; }
    const c = (counts.get(ch.num) || 0) + 1;
    counts.set(ch.num, c);
    ch.filename = `Chapter ${ch.num}${c > 1 ? `-${c}` : ""}.txt`;
  }
  return { title, chapters, slug };
}

/* ---------------- chapter extraction ---------------- */

const CONTENT_SELECTORS = ["#chapter-c", ".chapter-c", "#chapter-content",
  ".chapter-content", 'div[itemprop="articleBody"]', ".box-chap"];
const AD_RE = /(CLICK\s*ADS|quảng cáo|mở khóa|truyenfull|đọc truyện online|ủng hộ dịch giả|Vui lòng|Mời bạn|novelfull|find any errors|broken links|non-standard content|report chapter|please report)/i;

/* Parse a chapter heading in either supported language:
   "Chương 5: Tiêu Viêm" (truyenfull) or "Chapter 5: Prologue" (novelfull). */
const HEADING_RE = /(?:Ch[ưu]ơ?ng|Chapter)\s*(\d+)\s*[:\-–]?\s*(.*)/i;
const HEADING_ONLY_RE = /^(?:Ch[ưu]ơ?ng|Chapter)\s*\d+$/i;
function parseHeading(text) {
  const m = text.match(HEADING_RE);
  if (!m) return { num: null, title: text.trim() };
  let title = m[2].trim();
  if (HEADING_ONLY_RE.test(title)) title = "";
  return { num: parseInt(m[1], 10), title };
}

function extractContent(doc) {
  let div = null;
  for (const sel of CONTENT_SELECTORS) { div = doc.querySelector(sel); if (div) break; }
  if (!div) {
    doc.querySelectorAll("script,style,nav,header,footer,form").forEach(t => t.remove());
    let best = 0;
    for (const d of doc.querySelectorAll("div")) {
      const len = d.textContent.length;
      if (len > best) { best = len; div = d; }
    }
    if (!div) return "";
  }
  div.querySelectorAll("script,style,ins,iframe,button").forEach(t => t.remove());
  div.querySelectorAll('[class*="ads"],[class*="banner"],[class*="lock"],[class*="notice"]')
     .forEach(t => t.remove());
  div.querySelectorAll("br").forEach(br => br.replaceWith("\n"));
  div.querySelectorAll("p").forEach(p => { p.prepend("\n"); p.append("\n"); });

  return div.textContent.split("\n")
    .map(l => l.trim())
    .filter(l => l && !(l.length < 200 && AD_RE.test(l)))
    .join("\n\n");
}

/* Chromium can refuse a handle whose cached name and on-disk name disagree
   after Unicode normalization ("state had changed since it was read from
   disk"), so fold names to plain ASCII */
const sanitize = name => name
  .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
  .replace(/đ/g, "d").replace(/Đ/g, "D")
  .replace(/:/g, " -").replace(/[\/\\|]/g, "-")
  .replace(/"/g, "'").replace(/</g, "(").replace(/>/g, ")").replace(/[?*]/g, "")
  .replace(/[^\x20-\x7E]/g, " ")
  .replace(/\s+/g, " ").trim().replace(/[. ]+$/, "").slice(0, 180);

/* parse an already-fetched chapter document into { filename, body }. The
   chapter heading ("Chương N: <name>" / "Chapter N: <name>") is prepended to
   the body so — for Vietnamese sources — the name is translated together with
   the chapter text, and every saved file opens with its heading. */
function parseChapter(doc, ch) {
  if (!ch.filename) throw new Error("cannot determine chapter number");
  const headEl = doc.querySelector("a.chapter-title, h2 a, h3 a, .chapter-title, .chapter-text");
  const head = parseHeading(headEl ? headEl.textContent.trim() : ch.text);
  let title = head.title || parseHeading(ch.text).title;
  let content = extractContent(doc);

  /* some layouts repeat the chapter heading as the content's first line —
     drop it there (and keep its title if it's the richer one) so the
     prepended heading isn't duplicated. Guarded to short, anchored,
     same-number lines so narrative text is never touched. */
  const nl = content.indexOf("\n");
  const firstLine = (nl === -1 ? content : content.slice(0, nl)).trim();
  if (firstLine.length < 120 && /^(?:Ch[ưu]ơ?ng|Chapter)\s*\d+/i.test(firstLine)) {
    const fh = parseHeading(firstLine);
    if (fh.num === ch.num) {
      if (!title && fh.title) title = fh.title;
      content = nl === -1 ? "" : content.slice(nl).replace(/^\n+/, "");
    }
  }

  if (!content.trim()) throw new Error("empty content");
  const word = SITE?.headingWord || "Chương";
  const heading = title ? `${word} ${ch.num}: ${title}` : `${word} ${ch.num}`;
  return { filename: ch.filename, body: `${heading}\n\n${content}` };
}

/* ---------------- output sinks ---------------- */

function folderSink(rootHandle, folderName) {
  let dir;
  const openDir = () => rootHandle.getDirectoryHandle(folderName, { create: true });

  /* Chromium invalidates cached directory handles when the folder changes on
     disk — including files being created in it by our own parallel workers —
     throwing "state had changed since it was read from disk". Funnel every
     file-system operation through one queue so creations never overlap, and
     refresh the handle + retry if the folder still changes under us
     (cloud sync, antivirus). */
  let tail = Promise.resolve();
  const locked = fn => {
    const p = tail.then(fn);
    tail = p.then(() => {}, () => {});
    return p;
  };

  /* when the folder rejects several writes in a row the blocker is
     environmental (Controlled Folder Access, antivirus) — stop burning
     ~7s of retries per file and fast-fail into the rescue path */
  let consecFails = 0;

  /* sub-directory handles (e.g. the translated-chapters folder) */
  const subdirs = new Map();
  const dirFor = async sub => {
    if (!sub) return dir;
    if (!subdirs.has(sub))
      subdirs.set(sub, await dir.getDirectoryHandle(sub, { create: true }));
    return subdirs.get(sub);
  };

  return {
    async init() { dir = await openDir(); },
    /* all non-empty filenames in one directory listing — vastly faster than
       per-file exists() when checking thousands of chapters on a resume */
    list(sub) {
      return locked(async () => {
        const out = new Set();
        try {
          const d = await dirFor(sub);
          const entries = [];
          for await (const [n, h] of d.entries()) if (h.kind === "file") entries.push([n, h]);
          await Promise.all(entries.map(async ([n, h]) => {
            try { if ((await h.getFile()).size > 0) out.add(n); } catch {}
          }));
        } catch {}
        return out;
      });
    },
    exists(name, sub) {
      return locked(async () => {
        try { return (await (await (await dirFor(sub)).getFileHandle(name)).getFile()).size > 0; }
        catch { return false; }
      });
    },
    read(name, sub) {
      return locked(async () => {
        try { return await (await (await (await dirFor(sub)).getFileHandle(name)).getFile()).text(); }
        catch { return null; }
      });
    },
    write(name, text, sub) {
      return locked(async () => {
        let lastErr;
        const attempts = consecFails >= 3 ? 1 : MAX_RETRIES;
        for (let attempt = 0; attempt < attempts; attempt++) {
          let w;
          try {
            if (attempt > 0) {
              try { dir = await openDir(); subdirs.clear(); } catch {}
              /* a half-written or externally touched file can wedge every
                 rewrite attempt — drop it and recreate from scratch */
              if (attempt > 1) { try { await (await dirFor(sub)).removeEntry(name); } catch {} }
            }
            w = await (await (await dirFor(sub)).getFileHandle(name, { create: true })).createWritable();
            await w.write(text);
            await w.close();
            consecFails = 0;
            return;
          } catch (e) {
            lastErr = e;
            /* never leave a failed stream dangling: its open swap file keeps
               the handle in the stale "state changed" condition and can wedge
               every subsequent attempt on the same file */
            if (w) { try { await w.abort(); } catch {} }
            await new Promise(res => setTimeout(res, 500 * 2 ** attempt));
          }
        }
        consecFails++;
        throw lastErr;
      });
    },
    async finish() {},
  };
}

function triggerDownload(blob, filename) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

async function saveAsZip(folderName, files, zipName) {
  const zip = new JSZip();
  const folder = zip.folder(folderName);
  for (const f of files) folder.file(f.filename, f.body);
  triggerDownload(await zip.generateAsync({ type: "blob" }), zipName);
}

function zipSink(folderName) {
  const files = [];
  const path = (name, sub) => (sub ? `${sub}/${name}` : name);
  return {
    async init() {},
    async list() { return new Set(); },
    async exists() { return false; },
    /* findLast: re-writes append, so the newest entry is authoritative
       (JSZip likewise keeps the last file added under a given name) */
    async read(name, sub) { return files.findLast(f => f.filename === path(name, sub))?.body ?? null; },
    async write(name, text, sub) { files.push({ filename: path(name, sub), body: text }); },
    async finish() {
      setStatus("Building ZIP…");
      await saveAsZip(folderName, files, `${folderName}.zip`);
    },
  };
}

/* helpers on the user-picked root folder: the per-slug title cache lives
   there, and a novel folder gets renamed once its title translation becomes
   available (copy + delete — the File System Access API can't rename dirs) */
function rootOps(rootHandle) {
  return {
    async read(name) {
      try { return await (await (await rootHandle.getFileHandle(name)).getFile()).text(); }
      catch { return null; }
    },
    async write(name, text) {
      const w = await (await rootHandle.getFileHandle(name, { create: true })).createWritable();
      await w.write(text);
      await w.close();
    },
    async renameMerge(oldName, newName) {
      let oldDir;
      try { oldDir = await rootHandle.getDirectoryHandle(oldName); } catch { return; }
      setStatus(`Renaming folder to "${newName}"…`);
      const copyInto = async (src, dst) => {
        for await (const [n, h] of src.entries()) {
          if (h.kind === "directory") {
            await copyInto(h, await dst.getDirectoryHandle(n, { create: true }));
          } else {
            let already = true;
            try { await dst.getFileHandle(n); } catch { already = false; }
            if (already) continue;  /* both exist: keep the existing file */
            const w = await (await dst.getFileHandle(n, { create: true })).createWritable();
            await w.write(await (await h.getFile()).arrayBuffer());
            await w.close();
          }
        }
      };
      await copyInto(oldDir, await rootHandle.getDirectoryHandle(newName, { create: true }));
      await rootHandle.removeEntry(oldName, { recursive: true });
      log(`Renamed folder "${oldName}" -> "${newName}"`);
    },
  };
}

/* ---------------- translation (Claude API) ---------------- */

const HAIKU = "claude-haiku-4-5";
const OPUS = "claude-opus-4-8";               // translates chapter + names together, one bundle at a time
const TRANSLATE_EFFORT = "medium";
const TRANSLATE_MAX_TOKENS = 128000;          // Opus 4.8 max output; a bundle's whole translation must fit under this
const NAMES_CACHE_FILE = ".names_cache.json";
const TITLE_CACHE_FILE = ".title_cache.json";
const TRANSLATED_DIR = "translated";
const FETCH_BATCH = 50;                        // chapters fetched per Worker call (free-tier subrequest limit)
const FIRST_FETCH_BATCH = 10;                  // small first group so files start appearing within seconds
/* A bundle's combined output (all its chapter translations + the names JSON)
   must stay under TRANSLATE_MAX_TOKENS or the batch truncates and the whole
   bundle is lost. We pack consecutive chapters up to this many estimated OUTPUT
   tokens — deliberately well below the 128K ceiling to leave headroom for the
   names JSON and for estimate error. Bigger bundles = fewer boundaries = less
   name drift, so keep it as large as safely fits. If a bundle still truncates,
   translateNovel splits it in half and retries (down to one chapter), so we
   never exceed the ceiling even when the estimate is wrong. */
const BUNDLE_OUTPUT_BUDGET = 80000;
/* Conservative token estimate for Vietnamese text (~2 chars/token). English
   output for a chapter runs BELOW its Vietnamese input estimate, so using this
   figure as the per-chapter output estimate over-counts — a safe direction. */
const estTokens = s => Math.ceil(s.length / 2);

/* Split chapters into sequential bundles whose combined body stays within a
   token budget, preserving order. A single oversized chapter still forms its
   own bundle. */
function chunkByTokens(chapters, budget) {
  const groups = [];
  let cur = [], curTok = 0;
  for (const ch of chapters) {
    const t = estTokens(ch.body || "");
    if (cur.length && curTok + t > budget) { groups.push(cur); cur = []; curTok = 0; }
    cur.push(ch); curTok += t;
  }
  if (cur.length) groups.push(cur);
  return groups;
}

/* The Message Batches endpoint is not CORS-enabled, so browser calls to
   api.anthropic.com are blocked. Route Claude API calls through the same
   Cloudflare Worker used for chapter fetching (server-to-server, no CORS) at
   the /anthropic/* path — see worker.js. */
/* `ignoreStop` is for the post-Stop calls (batch cancel, results collection)
   that must complete to keep paid-for work — they never abort and keep their
   retry backoff. Everything else aborts the moment Stop is pressed. */
async function apiFetch(path, body, { ignoreStop = false } = {}) {
  const url = `${PROXY}/anthropic/v1${path}`;
  const opts = {
    method: body ? "POST" : "GET",
    headers: {
      "content-type": "application/json",
      "x-api-key": $("apikey").value.trim(),
      "anthropic-version": "2023-06-01",
    },
    body: body ? JSON.stringify(body) : undefined,
    signal: ignoreStop ? undefined : aborter?.signal,
  };
  const backoff = i => (ignoreStop ? sleep : sleepUnlessStopped)(1000 * 2 ** i + Math.random() * 1000);
  let lastErr;
  for (let i = 0; i < MAX_RETRIES; i++) {
    if (!ignoreStop) throwIfStopped();
    let r;
    try {
      r = await fetch(url, opts);
    } catch (e) {
      if (e.name === "AbortError") throwIfStopped();   // Stop pressed mid-flight
      /* network-level failure (offline, dropped connection, or a CORS block) —
         "Failed to fetch" lands here; retry a few times before giving up */
      lastErr = new Error(`network error calling ${path} — ${e.message}`);
      await backoff(i);
      continue;
    }
    if (r.ok) return r;
    lastErr = new Error(`Claude API ${r.status}: ${(await r.text()).slice(0, 300)}`);
    if (r.status !== 429 && r.status < 500) throw lastErr;   // client error — don't retry
    await backoff(i);
  }
  throw lastErr;
}

/* One long-poll: the Worker checks the batch every ~10s for up to ~90s and
   returns the moment it ends, so the browser makes ~1 status call per 90s of
   batch time instead of one every 30s. `useSignal` lets a Stop abort the
   in-flight wait immediately. */
async function pollBatch(batchId, useSignal) {
  let lastErr;
  for (let i = 0; i < MAX_RETRIES; i++) {
    try {
      const r = await fetch(`${PROXY}/anthropic-poll/${batchId}`, {
        headers: { "x-api-key": $("apikey").value.trim(), "anthropic-version": "2023-06-01" },
        signal: useSignal ? aborter?.signal : undefined,
      });
      if (r.ok) return r.json();
      lastErr = new Error(`poll HTTP ${r.status}`);
    } catch (e) {
      if (e.name === "AbortError") throw e;   // Stop pressed — don't retry
      lastErr = e;
    }
    /* without a signal we're in the post-Stop path — keep real backoff
       (sleepUnlessStopped returns immediately once Stop is pressed) */
    await (useSignal ? sleepUnlessStopped : sleep)(1000 * 2 ** i + Math.random() * 1000);
  }
  throw lastErr;
}

/* ---- pending-batch registry (localStorage) ----
   Every submitted batch is recorded with the metadata needed to save its
   results later (the custom_id -> filename mapping). If the
   page dies while a batch is processing — tab discarded, phone slept, crash —
   the next run detects the orphaned batch, fetches its results (Anthropic
   keeps them for 29 days), and saves them instead of paying to redo them. */
const PENDING_KEY = "pendingBatches";
const loadPending = () => { try { return JSON.parse(localStorage.getItem(PENDING_KEY) || "[]") || []; } catch { return []; } };
const savePending = list => { try { localStorage.setItem(PENDING_KEY, JSON.stringify(list)); } catch {} };
const addPending = rec => savePending([...loadPending().filter(r => r.id !== rec.id), rec]);
const removePending = id => savePending(loadPending().filter(r => r.id !== id));
/* startup hygiene: drop records whose results Anthropic no longer retains */
savePending(loadPending().filter(r => r.id && Date.now() - (r.created || 0) < 29 * 864e5));

async function fetchBatchResults(id, label) {
  const results = new Map();
  const text = await (await apiFetch(`/messages/batches/${id}/results`, null, { ignoreStop: true })).text();
  for (const line of text.split("\n")) {
    if (!line.trim()) continue;
    const item = JSON.parse(line);
    if (item.result.type === "succeeded") results.set(item.custom_id, item.result.message);
    /* after a user Stop the unfinished requests come back "canceled" —
       expected, so don't spam the log with them */
    else if (!(item.result.type === "canceled" && stopRequested))
      log(`[${label}] ${item.custom_id}: ${item.result.type}`, "err");
  }
  return results;
}

/* submit a Message Batch, long-poll until it ends, return Map(custom_id → message).
   On Stop, the batch is canceled server-side; results that finished before the
   cancellation are still returned so paid-for work is kept. `meta` is the
   recovery record for the pending-batch registry. */
async function runBatch(requests, label, meta) {
  throwIfStopped();
  const batch = await (await apiFetch("/messages/batches", { requests })).json();
  if (meta) addPending({ ...meta, id: batch.id, created: Date.now() });
  log(`[${label}] batch submitted (${requests.length} request${requests.length > 1 ? "s" : ""}); polling…`);
  let cancelSent = false;
  for (;;) {
    let b;
    try {
      b = await pollBatch(batch.id, !cancelSent);
    } catch (e) {
      if (e.name === "AbortError" && stopRequested) {
        if (!cancelSent) {
          cancelSent = true;
          try {
            await apiFetch(`/messages/batches/${batch.id}/cancel`, {}, { ignoreStop: true });
            log(`[${label}] batch canceled — keeping results that already finished`, "err");
          } catch (ce) { log(`[${label}] cancel failed — ${errMsg(ce)}`, "err"); }
        }
        continue;   // keep polling (no abort signal) until the canceled batch ends
      }
      throw e;
    }
    const c = b.request_counts;
    setStatus(`[${label}] processing: ${c.processing}  ok: ${c.succeeded}  err: ${c.errored}`);
    if (b.processing_status === "ended") break;
  }
  const results = await fetchBatchResults(batch.id, label);
  removePending(batch.id);
  return results;
}

const messageText = msg =>
  msg.content.filter(b => b.type === "text").map(b => b.text).join("").trim();

const jsonFormat = schema => ({ format: { type: "json_schema", schema } });
const chapterNum = filename => {
  const m = filename.match(/^Chapter (\d+)/);
  return m ? parseInt(m[1], 10) : null;
};

/* ---- novel folder name: "{English title} ({Vietnamese title})" ---- */

/* Read the title cache and normalize legacy shapes to { vietName, english }. */
async function readTitleCache(root) {
  let cache = {};
  if (root) { try { cache = JSON.parse(await root.read(TITLE_CACHE_FILE) ?? "{}") || {}; } catch {} }
  return cache;
}
function titleEntry(cache, slug, vietName) {
  let entry = cache[slug];
  if (typeof entry === "string") return { vietName, english: entry };            // very old
  if (entry && entry.translated !== undefined)                                   // legacy {name, translated}
    return { vietName, english: entry.translated ? entry.name : null };
  return entry || { vietName, english: null };
}

/* No LLM here — the title is translated later, in the batched translation
   phase. This just applies whatever's cached: if an English name is known but
   the folder on disk is still under the Vietnamese name (from an earlier run),
   rename it now, before the sink starts writing. */
async function resolveFolderName(root, slug, title) {
  const vietName = sanitize(title);
  const cache = await readTitleCache(root);
  const entry = titleEntry(cache, slug, vietName);
  const target = entry.english || vietName;
  if (root && entry.english && entry.english !== vietName) {
    try { await root.renameMerge(vietName, entry.english); }
    catch (e) { log(`folder rename failed — ${errMsg(e)}`, "err"); }
  }
  if (root) {
    cache[slug] = { vietName, english: entry.english || null };
    try { await root.write(TITLE_CACHE_FILE, JSON.stringify(cache, null, 2)); } catch {}
  }
  return target;
}

/* Persist an English title rendering so the next run renames the folder. */
async function saveEnglishTitle(root, slug, title, englishRaw) {
  const vietName = sanitize(title);
  const english = sanitize(`${englishRaw} (${title})`);
  const cache = await readTitleCache(root);
  cache[slug] = { vietName, english };
  try { await root.write(TITLE_CACHE_FILE, JSON.stringify(cache, null, 2)); } catch {}
  return english;
}

/* ---- chapter translation into the translated/ subfolder ---- */

/* The glossary is an array of [Vietnamese, English] pairs on disk (one pair
   per line); in memory it's a Map keyed by the (unique) Vietnamese term.
   English may repeat. */
async function loadGlossary(sink) {
  const map = new Map();
  try {
    const raw = JSON.parse(await sink.read(NAMES_CACHE_FILE) ?? "null");
    const add = (vi, en) => {
      vi = String(vi).trim(); en = cleanEnglish(en);
      if (vi && en && isNamePair(vi, en)) map.set(vi, en);
    };
    if (Array.isArray(raw)) {
      for (const p of raw) {
        if (Array.isArray(p) && p.length >= 2) add(p[0], p[1]);
        else if (p && p.vietnamese) add(p.vietnamese, p.english ?? "");  // legacy objects
      }
    } else if (raw && typeof raw === "object") {           // legacy {vi: en} object
      for (const [k, v] of Object.entries(raw)) add(k, v);
    }
  } catch {}
  return map;
}
/* sorted alphabetically by the Vietnamese term (vi locale for diacritics) */
const glossaryPairs = map => [...map].sort((a, b) => a[0].localeCompare(b[0], "vi"));
/* merge model-returned pairs into the map (cleaned + name-checked; existing
   entries win). Returns how many were added. */
function mergePairs(map, pairs) {
  let added = 0;
  for (const { vietnamese, english } of pairs || []) {
    const vi = String(vietnamese ?? "").trim(), en = cleanEnglish(english ?? "");
    if (vi && en && isNamePair(vi, en) && !map.has(vi)) { map.set(vi, en); added++; }
  }
  return added;
}
const saveGlossary = (sink, map) =>
  sink.write(NAMES_CACHE_FILE,
    "[\n" + glossaryPairs(map).map(p => "  " + JSON.stringify(p)).join(",\n") + "\n]");

const titleRequest = title => ({
  custom_id: "title",
  params: {
    model: HAIKU,
    max_tokens: 100,
    messages: [{ role: "user", content:
      "Translate this Vietnamese novel title to natural English. Reply with ONLY the translated title, nothing else:\n" + title }],
  },
});

async function translateTitleBatch(title, slug) {
  const results = await runBatch([titleRequest(title)], "title",
    { kind: "bundle", slug, files: [], wantTitle: title });
  const tm = results.get("title");
  return tm ? messageText(tm) : null;
}

/* The bundle request returns BOTH the chapter translations and the new proper-
   name renderings in one structured object, so a single Opus call keeps names
   consistent across the whole bundle and we can parse each half cleanly. */
const BUNDLE_SCHEMA = {
  type: "object",
  properties: {
    chapters: {
      type: "array",
      items: {
        type: "object",
        properties: {
          n: {
            type: "integer",
            description: "The number from this chapter's '=== CHAPTER n ===' delimiter — its 1-based position in the bundle. NEVER the chapter number that appears inside the heading text.",
          },
          text: { type: "string", description: "This chapter's complete English translation." },
        },
        required: ["n", "text"],
        additionalProperties: false,
      },
    },
    names: {
      type: "array",
      items: {
        type: "object",
        properties: { vietnamese: { type: "string" }, english: { type: "string" } },
        required: ["vietnamese", "english"],
        additionalProperties: false,
      },
    },
  },
  required: ["chapters", "names"],
  additionalProperties: false,
};

const BUNDLE_SYSTEM =
  "You are translating a Vietnamese web novel into natural, fluent English. You receive a bundle of consecutive chapters to translate TOGETHER as one continuous work — not as independent, isolated chapters — plus a glossary of proper-name renderings already fixed in earlier chapters.\n"
  + "Before writing any translation, read ALL the chapters in the bundle and decide one English rendering for every proper name that appears anywhere in them (reusing the glossary for names already in it). Then translate every chapter using that single shared set of renderings.\n"
  + "In your `chapters` output, `n` is the number from that chapter's `=== CHAPTER n ===` delimiter — its 1-based position in this bundle — NEVER the chapter number that appears inside the heading text.\n"
  + "Translation rules:\n"
  + "- Translate each labelled chapter into natural, fluent English, EVERYTHING it contains — including its first line, the chapter heading (e.g. \"Chương 5: Tiêu Viêm\" -> \"Chapter 5: Xiao Yan\"). Keep that heading as the translated chapter's first line, followed by a blank line, then the prose. Preserve paragraph breaks (a blank line between paragraphs). Do not add or drop any heading, note, or commentary of your own — translate exactly what is given.\n"
  + "- NAME CONSISTENCY IS CRITICAL. Every proper name — characters, nicknames, places, sects/organizations, techniques, titles, brands — must use ONE identical English rendering in EVERY chapter it appears in across this bundle. If a name appears in Chapter 1 and again in Chapter 5 of this bundle, both must read exactly the same. Never render the same name two different ways between chapters. If a name is in the glossary, reuse that rendering EXACTLY; for a name not in the glossary, commit to the single best rendering once and apply it identically everywhere in the bundle.\n"
  + "- Romanize person names in the conventional form for the name's likely origin: most are Sino-Vietnamese, so use the standard pinyin-style English rendering (e.g. \"Tiêu Viêm\" -> \"Xiao Yan\", \"Đấu Khí\" -> \"Dou Qi\"), not a diacritic-stripped copy. Translate meaningful place/organization/technique names.\n"
  + "Name-list rules (the `names` array):\n"
  + "- Return ONLY names that are NEW to the glossary — proper names that appear in these chapters but are NOT already listed in the glossary above. Do NOT re-list, repeat, or echo back any name that is already in the glossary, even when it appears in these chapters (those are already known). List each new name once, as a {vietnamese, english} pair whose english is exactly the rendering you used in the translation.\n"
  + "- Each pair is a NAME ONLY on both sides. The vietnamese value is the bare name exactly as written — a noun phrase, never a clause or sentence containing it (from \"Giang Minh Kỳ thật đến rồi\" extract only \"Giang Minh Kỳ\"; ordinary words like \"thật\", \"đến rồi\" are not names). The english is the name as it appears in the translation, nothing else: no surrounding words, no parenthetical notes or qualifiers (write \"Si He Yuan\", never \"Si He Yuan (restaurant)\"), and no alternatives — never use \"/\" to offer two versions (write \"Peak Villas\", never \"Bantian/Peak Villas\").";

/* Enforce the glossary rules on the English side even if the model slips (or
   an older cache file already contains offenders): drop parenthetical notes,
   and when alternatives are offered with "/", keep the longest one. */
const cleanEnglish = en => {
  en = String(en).replace(/\s*\([^)]*\)/g, "");
  if (en.includes("/"))
    en = en.split("/").map(s => s.trim()).reduce((a, b) => (b.length > a.length ? b : a), "");
  return en.replace(/\s+/g, " ").trim();
};

/* Reject pairs that are really sentence fragments, not names — e.g.
   "Giang Minh Ky thật đến rồi" -> "The real Jiang Mingqi has arrived".
   Signals: Vietnamese sentence particles standing alone (lowercase, so
   name words like "ngoại" in "Bà ngoại Lâm" don't match), lowercase
   conjugated English verbs (case-sensitive, so a name like "Will" stays
   safe), or implausible length for a name. */
const VI_PARTICLES = new Set(["là", "của", "và", "rằng", "thì", "mà", "rồi",
  "đã", "đang", "sẽ", "thật", "cũng", "đến", "không", "nhé", "ạ", "ơi", "vậy", "nữa"]);
const EN_VERBS_RE = /\b(is|are|was|were|has|have|had|will|would|did|arrived|came|come|said|went)\b/;
function isNamePair(vi, en) {
  const viWords = vi.split(/\s+/), enWords = en.split(/\s+/);
  if (viWords.length > 7 || enWords.length > 8) return false;
  if (viWords.some(w => VI_PARTICLES.has(w))) return false;
  if (EN_VERBS_RE.test(en)) return false;
  return true;
}

/* Recover batches submitted by a previous page session that were never
   collected (tab discarded, phone slept, crash): wait for each one to end,
   fetch its results — Anthropic keeps them 29 days — and save them exactly as
   the original run would have, instead of paying to redo the work. */
async function recoverPendingBatches(sink, ctx) {
  const fresh = loadPending().filter(r => r.id && Date.now() - (r.created || 0) < 29 * 864e5);
  savePending(fresh);
  const mine = fresh.filter(r => r.slug === ctx.slug);
  if (!mine.length) return;
  log(`Found ${mine.length} unfinished batch(es) from a previous session — recovering…`);
  for (const rec of mine) {
    throwIfStopped();
    try {
      for (;;) {
        const b = await pollBatch(rec.id, true);
        const c = b.request_counts;
        setStatus(`[recover] processing: ${c.processing}  ok: ${c.succeeded}  err: ${c.errored}`);
        if (b.processing_status === "ended") break;
      }
      const results = await fetchBatchResults(rec.id, "recover");
      if (rec.kind === "bundle") {
        /* one bundle: a single "bundle" request carrying {chapters, names},
           optionally plus a "title" request on the very first bundle */
        const msg = results.get("bundle");
        if (msg && msg.stop_reason !== "max_tokens") {
          let parsed = null;
          try { parsed = JSON.parse(messageText(msg)); } catch {}
          if (parsed) {
            const glossary = await loadGlossary(sink);
            const added = mergePairs(glossary, parsed.names);
            await saveGlossary(sink, glossary);
            let n = 0;
            for (const item of parsed.chapters || []) {
              const fn = (rec.files || [])[parseInt(item.n, 10) - 1];
              if (!fn || !item.text || !item.text.trim()) continue;
              if (await sink.exists(fn, TRANSLATED_DIR)) continue;
              await sink.write(fn, item.text, TRANSLATED_DIR);
              n++;
              log(`saved  ${TRANSLATED_DIR}/${fn} (recovered)`, "ok");
            }
            log(`Recovered bundle: ${n} chapter(s), +${added} names`, "ok");
          }
        }
        const tm = rec.wantTitle ? results.get("title") : null;
        if (tm && ctx.root) {
          const eng = await saveEnglishTitle(ctx.root, ctx.slug, rec.wantTitle, messageText(tm));
          log(`Title recovered — folder will be renamed to "${eng}" on the next run.`, "ok");
        }
      } else if (rec.kind === "translate") {
        /* legacy per-chapter parallel batch from an older app version */
        let n = 0;
        for (let i = 0; i < (rec.files || []).length; i++) {
          const msg = results.get(`ch-${i}`);
          if (!msg || msg.stop_reason === "max_tokens") continue;
          const text = messageText(msg);
          if (!text || await sink.exists(rec.files[i], TRANSLATED_DIR)) continue;
          await sink.write(rec.files[i], text, TRANSLATED_DIR);
          n++;
          log(`saved  ${TRANSLATED_DIR}/${rec.files[i]} (recovered)`, "ok");
        }
        log(`Recovered ${n} translated chapter(s)`, "ok");
      } else {   /* legacy glossary batch (optionally carrying the title) */
        const gm = results.get("glossary");
        let pairs = [];
        if (gm) { try { pairs = JSON.parse(messageText(gm)).pairs; } catch {} }
        const glossary = await loadGlossary(sink);
        const added = mergePairs(glossary, pairs);
        await saveGlossary(sink, glossary);
        const tm = rec.wantTitle ? results.get("title") : null;
        if (tm && ctx.root) {
          const eng = await saveEnglishTitle(ctx.root, ctx.slug, rec.wantTitle, messageText(tm));
          log(`Title recovered — folder will be renamed to "${eng}" on the next run.`, "ok");
        }
        log(`Recovered glossary batch: +${added} names`, "ok");
      }
      removePending(rec.id);
    } catch (e) {
      if (e.stopped || e.name === "AbortError") throw e;
      if (/HTTP 4\d\d/.test(e.message)) {
        log(`! batch …${rec.id.slice(-8)} is no longer available (${errMsg(e)}); dropping it`, "err");
        removePending(rec.id);
      } else {
        /* transient failure — retry on the next run, but never forever */
        rec.tries = (rec.tries || 0) + 1;
        if (rec.tries >= 5) {
          log(`! batch …${rec.id.slice(-8)} failed recovery ${rec.tries} times (${errMsg(e)}); giving up on it`, "err");
          removePending(rec.id);
        } else {
          addPending(rec);   // persist the attempt counter
          log(`! could not recover batch …${rec.id.slice(-8)} (${errMsg(e)}); will retry next run (attempt ${rec.tries}/5)`, "err");
        }
      }
    }
  }
}

/* Translate pending chapters into translated/, keeping the same filenames as
   their sources so re-runs can skip what's already done.

   Chapters are sent in sequential bundles (up to BUNDLE_OUTPUT_BUDGET each). One
   Opus 4.8 request per bundle translates the whole bundle AND returns the new
   proper-name renderings, as one structured object — so names stay consistent
   across every chapter in the bundle instead of drifting between separate
   per-chapter calls. Each bundle carries the glossary accumulated from all
   earlier bundles (and earlier runs), so a name fixed early is reused verbatim
   later. Bundles run one at a time over the Batch API; after each, the glossary
   is saved and every translated chapter written, so a re-run resumes from the
   first missing chapter. `ctx` carries {root, slug, title} for recovery and the
   batched title translation. */
async function translateNovel(sink, chapters, ctx = {}) {
  await recoverPendingBatches(sink, ctx);

  /* one directory listing instead of a per-chapter exists() check */
  const doneSet = await sink.list(TRANSLATED_DIR);
  const pending = [];
  for (const ch of chapters) {
    if (doneSet.has(ch.filename)) continue;
    let body = ch.body ?? await sink.read(ch.filename);
    if (!body) continue;
    /* raw files saved by older app versions have no heading line — synthesize
       one so every translated chapter starts with its heading */
    if (!/^(?:Ch[ưu]ơ?ng|Chapter)\s*\d+/i.test(body)) {
      const n = chapterNum(ch.filename);
      if (n != null) body = `${SITE?.headingWord || "Chương"} ${n}\n\n${body}`;
    }
    pending.push({ filename: ch.filename, body });
  }

  /* translate the folder title (via the Batch API, folded into the first
     bundle) only if we have a writable root and it isn't already translated */
  let wantTitle = null;
  if (ctx.root && ctx.title) {
    const entry = titleEntry(await readTitleCache(ctx.root), ctx.slug, sanitize(ctx.title));
    if (!entry.english) wantTitle = ctx.title;
  }

  if (!pending.length) {
    log("Translation: everything already translated.", "ok");
    if (wantTitle) {   /* nothing left to bundle it into — send it on its own */
      const eng0 = await translateTitleBatch(wantTitle, ctx.slug);
      if (eng0 && ctx.root) {
        const eng = await saveEnglishTitle(ctx.root, ctx.slug, ctx.title, eng0);
        log(`Title translated — folder will be renamed to "${eng}" on the next run.`, "ok");
      }
    }
    return;
  }

  const glossary = await loadGlossary(sink);
  /* Work queue of bundles, processed in order so names propagate forward. A
     bundle that truncates is split in half and its halves pushed back to the
     FRONT (first half first), so we retry smaller without ever exceeding the
     output ceiling. */
  const queue = chunkByTokens(pending, BUNDLE_OUTPUT_BUDGET);
  log(`Translating ${pending.length} chapter(s) with ${OPUS} (effort=${TRANSLATE_EFFORT}, Batches API) in ${queue.length} sequential bundle(s)`);

  let saved = 0, failed = 0, bundleNo = 0, titleSent = false;
  while (queue.length && !stopRequested) {
    throwIfStopped();
    const group = queue.shift();
    bundleNo++;
    setStatus(`Translating bundle ${bundleNo} (${group.length} chapter${group.length > 1 ? "s" : ""})…`);

    /* chapters are labelled 1..N; the model echoes each number back in `n` */
    const blob = group
      .map((ch, i) => `=== CHAPTER ${i + 1} ===\n${ch.body}`)
      .join("\n\n");
    const userContent =
      "GLOSSARY of proper-name renderings already fixed in earlier chapters, as [Vietnamese, English] pairs — reuse each EXACTLY wherever that name appears:\n"
      + JSON.stringify(glossaryPairs(glossary))
      + `\n\nTranslate the following ${group.length} chapter(s) together as one continuous whole, using ONE identical English rendering for each proper name across every chapter below (a name in CHAPTER 1 must match the same name in CHAPTER ${group.length}). Return every chapter's full translation in \`chapters\`, setting \`n\` to the delimiter number (1-${group.length}) — not the heading's own chapter number — and in \`names\` ONLY the proper names that are NEW, not already in the glossary above.\n\n`
      + blob;

    /* only the first batch we submit carries the one-shot title translation */
    const withTitle = !titleSent && !!wantTitle;
    const reqs = [{
      custom_id: "bundle",
      params: {
        model: OPUS,
        max_tokens: TRANSLATE_MAX_TOKENS,
        system: BUNDLE_SYSTEM,
        messages: [{ role: "user", content: userContent }],
        output_config: { effort: TRANSLATE_EFFORT, ...jsonFormat(BUNDLE_SCHEMA) },
      },
    }];
    if (withTitle) reqs.push(titleRequest(wantTitle));

    const results = await runBatch(reqs, `translate ${bundleNo}`,
      { kind: "bundle", slug: ctx.slug, files: group.map(ch => ch.filename),
        wantTitle: withTitle ? wantTitle : null });

    /* the short title request succeeds independently of the bundle, so collect
       it even if the bundle itself truncated */
    if (withTitle) {
      titleSent = true;
      const tm = results.get("title");
      if (tm && ctx.root) {
        const eng = await saveEnglishTitle(ctx.root, ctx.slug, ctx.title, messageText(tm));
        log(`Title translated — folder will be renamed to "${eng}" on the next run.`, "ok");
      }
    }

    const msg = results.get("bundle");
    /* a truncated bundle is unparseable structured JSON — split and retry the
       halves so its total output fits under the ceiling */
    if (!msg || msg.stop_reason === "max_tokens") {
      if (msg && group.length > 1) {
        const mid = Math.ceil(group.length / 2);
        queue.unshift(group.slice(mid));
        queue.unshift(group.slice(0, mid));
        log(`! bundle ${bundleNo}: output truncated (max_tokens); splitting ${group.length} → ${mid}+${group.length - mid} and retrying`, "err");
      } else {
        failed += group.length;
        log(`! bundle ${bundleNo}: ${msg ? "output truncated (max_tokens) even for a single chapter" : "no result"}; not saved`, "err");
      }
      continue;
    }
    let parsed = null;
    try { parsed = JSON.parse(messageText(msg)); } catch (e) {
      failed += group.length;
      log(`! bundle ${bundleNo}: could not parse structured output (${errMsg(e)}); not saved`, "err");
      continue;
    }

    /* fold the new names in first, so later bundles stay consistent even if a
       chapter write below fails */
    const added = mergePairs(glossary, parsed.names);
    await saveGlossary(sink, glossary);

    /* `n` must be the 1..N delimiter number; if the model echoed the novel's
       own chapter numbers instead but still returned one entry per chapter,
       recover by mapping positionally */
    let items = parsed.chapters || [];
    const ns = items.map(it => parseInt(it.n, 10));
    const validNs = items.length > 0
      && ns.every(v => v >= 1 && v <= group.length)
      && new Set(ns).size === ns.length;
    if (!validNs && items.length === group.length) {
      items = items.map((it, idx) => ({ ...it, n: idx + 1 }));
      log(`! bundle ${bundleNo}: response chapter numbering was off — mapped by position`, "err");
    }

    const handled = new Set();
    for (const item of items) {
      const ch = group[parseInt(item.n, 10) - 1];
      if (!ch || handled.has(ch.filename) || !item.text || !item.text.trim()) continue;
      handled.add(ch.filename);
      if (doneSet.has(ch.filename)) continue;
      try {
        await sink.write(ch.filename, item.text, TRANSLATED_DIR);
        doneSet.add(ch.filename);
        saved++;
        log(`saved  ${TRANSLATED_DIR}/${ch.filename}`, "ok");
      } catch (e) {
        failed++;
        log(`SAVE FAILED ${TRANSLATED_DIR}/${ch.filename} — ${errMsg(e)}`, "err");
      }
    }
    /* chapters the response skipped entirely: count and surface them instead
       of silently reporting success (a re-run picks them up) */
    const missing = group.filter(ch => !handled.has(ch.filename));
    if (missing.length) {
      failed += missing.length;
      log(`! bundle ${bundleNo}: ${missing.length} chapter(s) missing from the response (${missing.map(c => c.filename.replace(/\.txt$/, "")).join(", ")})`, "err");
    }
    log(`Bundle ${bundleNo}: +${added} names (${glossary.size} total)`, "ok");
  }
  log(`Translation ${stopRequested ? "stopped" : "done"}: ${saved} ok, ${failed} failed`
    + (failed || stopRequested ? " (re-run to resume the rest)" : ""), failed ? "err" : "ok");
}

/* ---------------- main flow ---------------- */

async function run(makeSink, root = null, only = null) {
  if (running) return;
  const novelUrl = $("url").value.trim();
  const concurrency = Math.max(1, Math.min(50, parseInt($("conc").value, 10) || 10));
  const site = siteFor(novelUrl);
  if (!site) {
    setStatus("Enter a novel URL from truyenfull.today, truyenfull.live, or novelfull.com");
    return;
  }
  SITE = site;
  const translate = $("translate").checked;
  if (translate && !$("apikey").value.trim()) {
    setStatus("Enter your Anthropic API key to translate.");
    return;
  }

  running = true;
  stopRequested = false;
  wasStopped = false;
  lastFailed = null;
  lastRun = { makeSink, root };
  aborter = new AbortController();
  $("btn-stop").disabled = false;
  await acquireWakeLock();
  updateButtons();
  logEl.textContent = "";
  bar.style.display = "block";
  bar.value = 0;

  /* kept at function scope so `finally` can offer a Retry of what failed */
  const failed = [];
  let runTitle = null;

  try {
    let title, chapters;
    if (only) {
      ({ title, chapters } = only);
      runTitle = title;
      log(`Retrying ${chapters.length} failed chapter(s)… (v${VERSION})`);
    } else {
      setStatus("Listing chapters…");
      ({ title, chapters } = await listAllChapters(novelUrl, concurrency));
      if (!chapters.length) throw new Error("no chapters found — site layout may have changed");
      runTitle = title;
      log(`${title} — ${chapters.length} chapters, fetch concurrency ${concurrency} (v${VERSION})`);
    }
    const slug = SITE.normalize(novelUrl).slug;
    const folderName = await resolveFolderName(root, slug, title);
    log(`Saving to: ${folderName}/`);

    const sink = await makeSink(folderName);
    await sink.init();

    let done = 0, saved = 0, skipped = 0;
    bar.max = chapters.length;

    const pendingSaves = [];
    const collected = [];
    const status = () => setStatus(`${done}/${chapters.length} done (${saved} saved, ${skipped} skipped, ${failed.length + pendingSaves.length} failed)`);

    /* Parse a freshly-fetched chapter, keep it for translation, and write it
       to the folder (falling back to the pendingSaves rescue path on a write
       error). Throws when the HTML is missing/unparseable so the caller can
       mark the chapter failed. Shared by the main loop and the retry pass. */
    const absorb = async (ch, html, retry = false) => {
      if (!html) throw new Error("fetch failed");
      const { filename, body } = parseChapter(new DOMParser().parseFromString(html, "text/html"), ch);
      collected.push({ filename, body });
      /* the pre-run directory listing (absorb only runs after it's built) —
         an in-memory check instead of a per-chapter filesystem round-trip
         through the write queue */
      if (existing.has(filename)) { skipped++; log(`skip   ${filename}`); return; }
      try { await sink.write(filename, body); saved++; log(`saved  ${filename}${retry ? " (retry)" : ""}`, "ok"); }
      catch (e) {
        pendingSaves.push({ url: ch.url, filename, body });
        log(`SAVE FAILED ${filename} — ${errMsg(e)} (will retry at the end)`, "err");
      }
    };

    /* skip already-downloaded chapters without any fetch: one directory
       listing checked in memory, instead of a filesystem call per chapter */
    setStatus("Checking already-downloaded chapters…");
    const existing = await sink.list();
    const toFetch = [];
    for (const ch of chapters) {
      if (ch.filename && existing.has(ch.filename)) {
        collected.push({ filename: ch.filename, body: null });
        skipped++; bar.value = ++done;
      } else {
        toFetch.push(ch);
      }
    }
    if (skipped) log(`skip   ${skipped} already-downloaded chapter(s)`);
    status();

    /* Fetch one group per /fetch-many call, and run several calls in parallel
       via fetchInPool so high slider values are honored (one Worker
       invocation is limited to ~6 connections). `retry` only changes log
       flavor and skips the progress-bar bump (retried chapters were already
       counted). Never throws — failures land in `failed`. */
    /* count of /fetch-many calls currently on the wire — logged after each
       batch so it's visible in the log whether batches really run in
       parallel (network-bound) or the time is going to saving files */
    let inFlight = 0;
    const fetchGroup = retry => async (group, conc) => {
      const t0 = performance.now();
      let htmls;
      inFlight++;
      try { htmls = await fetchMany(group.map(c => c.url), conc); }
      catch (e) {
        if (stopRequested && !retry) return;
        for (const ch of group) {
          failed.push(ch);
          log(`DOWNLOAD FAILED ${ch.url} — ${errMsg(e)}${retry ? " (retry)" : ""}`, "err");
          if (!retry) bar.value = ++done;
        }
        status();
        return;
      } finally { inFlight--; }
      log(`fetched ${group.length} page(s) in ${((performance.now() - t0) / 1000).toFixed(1)}s`
        + (inFlight ? ` — ${inFlight} more batch${inFlight === 1 ? "" : "es"} in flight` : ""));
      for (const ch of group) {
        try { await absorb(ch, htmls.get(ch.url), retry); }
        catch (e) { failed.push(ch); log(`DOWNLOAD FAILED ${ch.url} — ${errMsg(e)}${retry ? " (retry)" : ""}`, "err"); }
        if (!retry) bar.value = ++done;
        status();
      }
    };

    /* group the chapters — a small first group so files start appearing right
       away, then FETCH_BATCH at a time */
    const groups = [];
    for (let i = 0; i < toFetch.length;) {
      const group = toFetch.slice(i, i + (i === 0 ? FIRST_FETCH_BATCH : FETCH_BATCH));
      groups.push(group);
      i += group.length;
    }
    if (groups.length) {
      setStatus(`Fetching ${toFetch.length} chapter(s)…`);
      await fetchInPool(groups, concurrency, fetchGroup(false));
    }

    /* End-of-run retry: once every other chapter is downloaded, take all the
       chapters that failed above — pooled across every batch — and re-fetch
       them in fresh FETCH_BATCH-sized Worker calls. Survivors drop out of
       `failed`; whatever still fails is left for the manual "Retry failed"
       button. Runs before the save-retry so recovered chapters that then fail
       to write still get the pendingSaves rescue + ZIP fallback. */
    if (failed.length && !stopRequested) {
      const toRetry = failed.splice(0);
      log(`\nRetrying ${toRetry.length} failed chapter(s)…`);
      setStatus(`Retrying ${toRetry.length} failed download(s)…`);
      const rgroups = [];
      for (let j = 0; j < toRetry.length; j += FETCH_BATCH) rgroups.push(toRetry.slice(j, j + FETCH_BATCH));
      await fetchInPool(rgroups, concurrency, fetchGroup(true));
    }

    /* chapters that downloaded but would not save: retry one by one now
       that no other writes are in flight */
    const rescued = [];
    for (let i = 0; i < pendingSaves.length; i++) {
      const p = pendingSaves[i];
      setStatus(`Retrying failed saves… ${i + 1}/${pendingSaves.length}`);
      try { await sink.write(p.filename, p.body); saved++; log(`saved  ${p.filename} (retry)`, "ok"); }
      catch (e) { rescued.push(p); log(`SAVE FAILED ${p.filename} — ${errMsg(e)}`, "err"); }
    }

    /* last resort: the content is already downloaded, so never drop it —
       hand it over as a ZIP, which bypasses folder writes entirely */
    if (rescued.length) {
      setStatus("Folder saves failed — building rescue ZIP…");
      await saveAsZip(folderName, rescued, `${folderName} - rescued chapters.zip`);
      log(`\n${rescued.length} chapter(s) would not save to the folder — they were downloaded as "${folderName} - rescued chapters.zip" instead.`, "err");
      log(`If folder saving keeps failing: check Windows Security → Ransomware protection → "Controlled folder access" (it silently blocks Chrome from writing), and note that Desktop/Documents folders are often OneDrive-synced by default even when they look local.`);
    }

    if (translate && collected.length && !stopRequested) {
      collected.sort((a, b) => (chapterNum(a.filename) ?? 1e9) - (chapterNum(b.filename) ?? 1e9));
      try { await translateNovel(sink, collected, { root, slug, title }); }
      catch (e) {
        if (e.stopped) { log("Translation stopped by user.", "err"); }
        else {
          log(`TRANSLATION FAILED — ${errMsg(e)}`, "err");
          if (/network error|Failed to fetch/i.test(e.message))
            log("A network error reached the Claude API. Downloaded chapters and any glossary/translations so far are saved — re-run to resume. If it keeps failing, open DevTools (F12) → Console: a line mentioning \"CORS policy\" means the Batches endpoint is blocking direct browser calls, anything else is a plain network drop.", "err");
        }
      }
    }

    await sink.finish();
    const summary = `${saved} saved, ${skipped} skipped, ${failed.length} failed`
      + (rescued.length ? `, ${rescued.length} rescued to ZIP.` : ".");
    setStatus(`${stopRequested ? "Stopped" : "Done"}: ${summary}`);
    /* always end with a clear finish line in the log so it's obvious the run
       is complete (not still running / stuck) */
    log(`\n${stopRequested ? "Stopped" : "✓ Finished — all downloads complete"}: ${summary}`,
      stopRequested || failed.length ? "err" : "ok");
    if (stopRequested) log("Re-run to resume where you left off.", "err");
    if (failed.length) log(`${failed.length} chapter(s) failed to download — click “Retry failed” to try just those again.`, "err");
  } catch (e) {
    setStatus(e.stopped ? "Stopped." : `Error: ${e.message}`);
    if (!e.stopped) log(`ERROR — ${errMsg(e)}`, "err");
  } finally {
    running = false;
    wasStopped = stopRequested;
    stopRequested = false;
    /* offer a Retry of only the chapters that failed to download, reusing the
       same sink (folder handle) so no re-picking and no re-listing */
    lastFailed = (failed.length && runTitle)
      ? { makeSink, root, title: runTitle, chapters: failed.slice() }
      : null;
    releaseWakeLock();
    updateButtons();
  }
}

$("btn-folder").addEventListener("click", async () => {
  /* the button is always enabled, so guard here: give clear feedback instead
     of making the user pick a folder for a run that will silently no-op */
  if (!siteFor($("url").value)) {
    setStatus("Enter a novel URL from truyenfull.today, truyenfull.live, or novelfull.com");
    return;
  }
  if (!window.showDirectoryPicker) {
    setStatus("Folder saving needs Chrome or Edge — use “Download as ZIP” instead.");
    return;
  }
  let root;
  try { root = await showDirectoryPicker({ mode: "readwrite" }); }
  catch { return; /* user canceled */ }
  run(folderName => folderSink(root, folderName), rootOps(root));
});

$("btn-zip").addEventListener("click", () => run(folderName => zipSink(folderName)));
</script>
</body>
