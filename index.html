<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111418">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Novel Downloader</title>
<style>
  :root { --bg:#111418; --card:#1b2026; --fg:#e8eaed; --muted:#9aa0a6; --accent:#4f8cff; }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(1100px 600px at 50% -10%, #1b2440 0%, var(--bg) 60%);
    color: var(--fg); font: 16px/1.6 system-ui, sans-serif; padding: 24px;
  }
  main { text-align: center; max-width: 460px; }
  .logo {
    width: 96px; height: 96px; border-radius: 24px; margin-bottom: 28px;
    box-shadow: 0 12px 40px rgba(79, 140, 255, .35);
  }
  h1 { font-size: 34px; letter-spacing: -.5px; margin-bottom: 10px; }
  p.sub { color: var(--muted); font-size: 15px; margin-bottom: 36px; }
  a.download {
    display: inline-block; background: var(--accent); color: #fff; text-decoration: none;
    font-size: 17px; font-weight: 700; padding: 15px 44px; border-radius: 12px;
    box-shadow: 0 8px 28px rgba(79, 140, 255, .4);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  a.download:hover { transform: translateY(-2px); box-shadow: 0 12px 34px rgba(79, 140, 255, .5); }
  a.download:active { transform: translateY(0); }
  p.note { color: var(--muted); font-size: 13px; margin-top: 22px; }
</style>
</head>
<body>
<main>
  <img class="logo" src="icon-192.png" alt="">
  <h1>Novel Downloader</h1>
  <p class="sub">Download web novels to your phone, chapter by chapter — with browsing, resume, and Claude-powered English translation built in.</p>
  <!-- served from this same domain (the Pages workflow bundles the signed APK
       next to this page), so the tap downloads the file directly instead of
       bouncing through a github.com release redirect -->
  <a class="download" id="dl" href="novel-downloader.apk" download="novel-downloader.apk">Download for Android</a>
  <p class="note" id="ver">The app checks for updates and upgrades itself.</p>
</main>
<script>
  /* this page replaced an installable web app — clean up its old service
     worker and caches for returning visitors */
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
  }
  if (window.caches) { caches.keys().then(ks => ks.forEach(k => caches.delete(k))); }

  /* show which build the bundled APK is */
  fetch("version.json", { cache: "no-store" })
    .then(r => r.ok ? r.json() : null)
    .then(v => {
      if (v && v.versionName) {
        document.getElementById("ver").textContent =
          "v" + v.versionName + " — the app checks for updates and upgrades itself.";
      }
    })
    .catch(() => {});

  /* if the bundle is missing (first deploy, or a release that never
     published), fall back to downloading from the GitHub release */
  fetch("novel-downloader.apk", { method: "HEAD" })
    .then(r => {
      if (!r.ok) throw 0;
    })
    .catch(() => {
      const a = document.getElementById("dl");
      a.href = "https://github.com/vtlinh/novels/releases/download/android-latest/app-release.apk";
      a.removeAttribute("download");
    });
</script>
</body>
</html>
