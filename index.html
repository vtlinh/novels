<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Novel Downloader</title>
<style>
  :root { --bg:#111418; --card:#1b2026; --fg:#e8eaed; --muted:#9aa0a6;
          --accent:#4f8cff; --ok:#3ddc84; --err:#ff6b6b; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--bg);
         color:var(--fg); display:flex; justify-content:center; padding:32px 16px; }
  main { width:100%; max-width:680px; }
  h1 { font-size:22px; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 24px; font-size:13px; }
  .card { background:var(--card); border-radius:12px; padding:20px; margin-bottom:16px; }
  label { display:block; font-size:12px; color:var(--muted); margin:12px 0 4px; }
  label:first-child { margin-top:0; }
  input { width:100%; padding:10px 12px; border-radius:8px; border:1px solid #333a42;
          background:#12161b; color:var(--fg); font-size:14px; }
  input:focus { outline:none; border-color:var(--accent); }
  input[type="range"] { padding:0; border:none; background:none;
                        accent-color:var(--accent); }
  label.check { display:flex; align-items:center; gap:8px; margin-top:16px;
                color:var(--fg); font-size:14px; cursor:pointer; }
  label.check input { width:auto; accent-color:var(--accent); }
  #tr-opts { display:none; }
  button { margin-top:16px; padding:11px 18px; border:none; border-radius:8px;
           font-size:14px; font-weight:600; cursor:pointer; }
  #btn-folder { background:var(--accent); color:#fff; margin-right:8px; }
  #btn-zip { background:#2a313a; color:var(--fg); margin-right:8px; }
  #btn-stop { background:var(--err); color:#fff; display:none; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  #status { font-size:13px; color:var(--muted); margin-top:14px; min-height:18px; }
  progress { width:100%; height:8px; margin-top:10px; accent-color:var(--accent);
             display:none; }
  #log { font:12px/1.6 ui-monospace, monospace; background:#0d1013; border-radius:8px;
         padding:12px; margin-top:12px; max-height:260px; overflow-y:auto;
         white-space:pre-wrap; display:none; }
  .ok { color:var(--ok); } .err { color:var(--err); }
</style>
</head>
<body>
<main>
  <h1>Novel Downloader</h1>
  <p class="sub">Downloads every chapter of a truyenfull novel as text files. <span id="ver"></span></p>

  <div class="card">
    <label for="url">Novel URL</label>
    <input id="url" type="url" placeholder="https://truyenfull.today/ten-truyen/" spellcheck="false">
    <label for="conc">Simultaneous downloads: <span id="conc-val">5</span></label>
    <input id="conc" type="range" min="1" max="10" value="5">
    <label class="check"><input type="checkbox" id="translate"> Translate to English (Claude)</label>
    <div id="tr-opts">
      <label for="apikey">Anthropic API key (kept in this browser only)</label>
      <input id="apikey" type="password" placeholder="sk-ant-..." spellcheck="false">
    </div>
    <button id="btn-folder">Download to folder…</button>
    <button id="btn-zip">Download as ZIP</button>
    <button id="btn-stop">Stop</button>
    <div id="status"></div>
    <progress id="bar" max="1" value="0"></progress>
    <div id="log"></div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
"use strict";

const VERSION = "1.18";
const $ = id => document.getElementById(id);
const statusEl = $("status"), logEl = $("log"), bar = $("bar");
$("ver").textContent = `v${VERSION}`;

const PROXY = "https://truyenfull.vtlinh87.workers.dev";

/* remember settings between visits */
$("url").value = localStorage.getItem("url") || "";
$("url").addEventListener("input", e => localStorage.setItem("url", e.target.value.trim()));
$("conc").value = localStorage.getItem("conc") || "5";
$("conc-val").textContent = $("conc").value;
$("conc").addEventListener("input", e => {
  $("conc-val").textContent = e.target.value;
  localStorage.setItem("conc", e.target.value);
});
$("translate").checked = localStorage.getItem("translate") === "1";
$("apikey").value = localStorage.getItem("apikey") || "";
const syncTrOpts = () => { $("tr-opts").style.display = $("translate").checked ? "block" : "none"; };
$("translate").addEventListener("change", e => {
  localStorage.setItem("translate", e.target.checked ? "1" : "0");
  syncTrOpts();
});
$("apikey").addEventListener("change", e => localStorage.setItem("apikey", e.target.value.trim()));
syncTrOpts();

const NOVEL_URL_RE = /^https:\/\/truyenfull\.today(\/|$)/i;
let running = false;
let stopRequested = false;
let aborter = null;

class StopError extends Error {
  constructor() { super("stopped by user"); this.stopped = true; }
}
const throwIfStopped = () => { if (stopRequested) throw new StopError(); };
async function sleepUnlessStopped(ms) {
  for (let t = 0; t < ms && !stopRequested; t += 500)
    await new Promise(res => setTimeout(res, 500));
}

if (!window.showDirectoryPicker)
  $("btn-folder").title = "Folder saving needs Chrome or Edge; use ZIP instead.";

function updateButtons() {
  const ok = NOVEL_URL_RE.test($("url").value.trim());
  $("btn-folder").disabled = running || !ok || !window.showDirectoryPicker;
  $("btn-zip").disabled = running || !ok;
  $("btn-stop").style.display = running ? "inline-block" : "none";
}
$("url").addEventListener("input", updateButtons);
updateButtons();

$("btn-stop").addEventListener("click", () => {
  stopRequested = true;
  aborter?.abort();
  $("btn-stop").disabled = true;
  setStatus("Stopping — finishing what's already in flight…");
  log("Stop requested.", "err");
});

function log(msg, cls) {
  logEl.style.display = "block";
  const line = document.createElement("div");
  if (cls) line.className = cls;
  line.textContent = msg;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}
function setStatus(msg) { statusEl.textContent = msg; }
const errMsg = e => (e.name && e.name !== "Error" ? `${e.name}: ` : "") + e.message;

/* ---------------- fetching & parsing ---------------- */

const MAX_RETRIES = 4;

function proxied(url) {
  return `${PROXY}/?url=${encodeURIComponent(url)}`;
}

async function fetchDoc(url) {
  let lastErr;
  for (let i = 0; i < MAX_RETRIES; i++) {
    throwIfStopped();
    try {
      const r = await fetch(proxied(url), { signal: aborter?.signal });
      if (r.ok) {
        const html = await r.text();
        if (html.trim()) return new DOMParser().parseFromString(html, "text/html");
      }
      lastErr = new Error(`HTTP ${r.status}`);
    } catch (e) {
      throwIfStopped();
      lastErr = e;
    }
    await sleepUnlessStopped(1000 * 2 ** i + Math.random() * 1000);
  }
  throw new Error(`failed after ${MAX_RETRIES} attempts: ${url} (${lastErr})`);
}

/* Fetch many chapter URLs in a SINGLE Worker call (up to FETCH_BATCH, the
   free-tier subrequest limit). `concurrency` caps how many requests the
   Worker keeps in flight against the site at once, so we don't hammer
   truyenfull. Returns Map(url -> html) for the ones that came back
   non-empty. Retries the whole call on a network error. */
async function fetchMany(urls, concurrency) {
  let lastErr;
  for (let i = 0; i < MAX_RETRIES; i++) {
    throwIfStopped();
    try {
      const r = await fetch(`${PROXY}/fetch-many`, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ urls, concurrency }),
        signal: aborter?.signal,
      });
      if (r.ok) {
        const { results } = await r.json();
        const map = new Map();
        for (const res of results || []) if (res.ok && res.html && res.html.trim()) map.set(res.url, res.html);
        return map;
      }
      lastErr = new Error(`proxy /fetch-many HTTP ${r.status}`);
    } catch (e) { throwIfStopped(); lastErr = e; }
    await sleepUnlessStopped(1000 * 2 ** i + Math.random() * 1000);
  }
  throw lastErr;
}

const slugOf = url => new URL(url).pathname.replace(/^\/|\/$/g, "").split("/")[0];

function chapterLinks(doc, base, slug) {
  const seen = new Set(), out = [];
  for (const a of doc.querySelectorAll("a[href]")) {
    let href;
    try { href = new URL(a.getAttribute("href"), base).href.split("#")[0]; }
    catch { continue; }
    const path = new URL(href).pathname;
    if (path.includes(`/${slug}/`) && /chuong-\d+/.test(path) && !seen.has(href)) {
      seen.add(href);
      out.push({ url: href, text: a.textContent.trim() });
    }
  }
  return out;
}

function maxListingPage(doc, slug) {
  let max = 1;
  for (const a of doc.querySelectorAll("a[href]")) {
    const m = (a.getAttribute("href") || "").match(new RegExp(`/${slug}/trang-(\\d+)`));
    if (m) max = Math.max(max, parseInt(m[1], 10));
  }
  return max;
}

async function listAllChapters(novelUrl) {
  const base = novelUrl.replace(/\/+$/, "") + "/";
  const slug = slugOf(base);
  const doc = await fetchDoc(base);
  const title = doc.querySelector('meta[property="og:title"]')?.content?.trim()
             || doc.querySelector("h1")?.textContent.trim() || slug;

  const seen = new Set(), chapters = [];
  const add = items => { for (const c of items) if (!seen.has(c.url)) { seen.add(c.url); chapters.push(c); } };

  add(chapterLinks(doc, base, slug));
  let last = maxListingPage(doc, slug);
  for (let page = 2; page <= last; page++) {
    throwIfStopped();
    setStatus(`Listing chapters: page ${page}/${last}…`);
    const p = await fetchDoc(`${base}trang-${page}/`);
    add(chapterLinks(p, base, slug));
    last = Math.max(last, maxListingPage(p, slug));
  }

  const num = u => { const m = u.match(/chuong-(\d+)/g); return m ? parseInt(m[m.length - 1].slice(7), 10) : 1e9; };
  chapters.sort((a, b) => num(a.url) - num(b.url));
  return { title, chapters };
}

/* ---------------- chapter extraction ---------------- */

const CONTENT_SELECTORS = ["#chapter-c", ".chapter-c", "#chapter-content",
  ".chapter-content", 'div[itemprop="articleBody"]', ".box-chap"];
const AD_RE = /(CLICK\s*ADS|quảng cáo|mở khóa|truyenfull|đọc truyện online|ủng hộ dịch giả|Vui lòng|Mời bạn)/i;

function parseHeading(text) {
  const m = text.match(/Ch[ưu]ơ?ng\s*(\d+)\s*[:\-–]?\s*(.*)/i);
  if (!m) return { num: null, title: text.trim() };
  let title = m[2].trim();
  if (/^Ch[ưu]ơ?ng\s*\d+$/i.test(title)) title = "";
  return { num: parseInt(m[1], 10), title };
}

function extractContent(doc) {
  let div = null;
  for (const sel of CONTENT_SELECTORS) { div = doc.querySelector(sel); if (div) break; }
  if (!div) {
    doc.querySelectorAll("script,style,nav,header,footer,form").forEach(t => t.remove());
    let best = 0;
    for (const d of doc.querySelectorAll("div")) {
      const len = d.textContent.length;
      if (len > best) { best = len; div = d; }
    }
    if (!div) return "";
  }
  div.querySelectorAll("script,style,ins,iframe,button").forEach(t => t.remove());
  div.querySelectorAll('[class*="ads"],[class*="banner"],[class*="lock"],[class*="notice"]')
     .forEach(t => t.remove());
  div.querySelectorAll("br").forEach(br => br.replaceWith("\n"));
  div.querySelectorAll("p").forEach(p => { p.prepend("\n"); p.append("\n"); });

  return div.textContent.split("\n")
    .map(l => l.trim())
    .filter(l => l && !(l.length < 200 && AD_RE.test(l)))
    .join("\n\n");
}

/* Chromium can refuse a handle whose cached name and on-disk name disagree
   after Unicode normalization ("state had changed since it was read from
   disk"), so fold names to plain ASCII */
const sanitize = name => name
  .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
  .replace(/đ/g, "d").replace(/Đ/g, "D")
  .replace(/:/g, " -").replace(/[\/\\|]/g, "-")
  .replace(/"/g, "'").replace(/</g, "(").replace(/>/g, ")").replace(/[?*]/g, "")
  .replace(/[^\x20-\x7E]/g, " ")
  .replace(/\s+/g, " ").trim().replace(/[. ]+$/, "").slice(0, 180);

const chapterFilename = (num, title) =>
  sanitize(title ? `Chapter ${num}: ${title}` : `Chapter ${num}`) + ".txt";

const chapterUrlNum = ch => {
  const m = ch.url.match(/chuong-(\d+)/g);
  return m ? parseInt(m[m.length - 1].slice(7), 10) : null;
};

/* the filename we can predict from the URL number + link text, used to skip a
   chapter that's already downloaded without fetching it */
const predictedName = ch => {
  const urlNum = chapterUrlNum(ch);
  const linkTitle = parseHeading(ch.text).title;
  return urlNum != null && linkTitle ? chapterFilename(urlNum, linkTitle) : null;
};

/* parse an already-fetched chapter document into { filename, body } */
function parseChapter(doc, ch) {
  const urlNum = chapterUrlNum(ch);
  const headEl = doc.querySelector("a.chapter-title, h2 a, .chapter-title");
  const head = parseHeading(headEl ? headEl.textContent.trim() : ch.text);
  const num = urlNum ?? head.num;
  if (num == null) throw new Error("cannot determine chapter number");
  const title = head.title || parseHeading(ch.text).title.replace(/^Ch[ưu]ơ?ng\s*\d+$/i, "");
  const body = extractContent(doc);
  if (!body.trim()) throw new Error("empty content");
  return { filename: chapterFilename(num, title), body };
}

/* ---------------- output sinks ---------------- */

function folderSink(rootHandle, folderName) {
  let dir;
  const openDir = () => rootHandle.getDirectoryHandle(folderName, { create: true });

  /* Chromium invalidates cached directory handles when the folder changes on
     disk — including files being created in it by our own parallel workers —
     throwing "state had changed since it was read from disk". Funnel every
     file-system operation through one queue so creations never overlap, and
     refresh the handle + retry if the folder still changes under us
     (cloud sync, antivirus). */
  let tail = Promise.resolve();
  const locked = fn => {
    const p = tail.then(fn);
    tail = p.then(() => {}, () => {});
    return p;
  };

  /* when the folder rejects several writes in a row the blocker is
     environmental (Controlled Folder Access, antivirus) — stop burning
     ~7s of retries per file and fast-fail into the rescue path */
  let consecFails = 0;

  /* sub-directory handles (e.g. the translated-chapters folder) */
  const subdirs = new Map();
  const dirFor = async sub => {
    if (!sub) return dir;
    if (!subdirs.has(sub))
      subdirs.set(sub, await dir.getDirectoryHandle(sub, { create: true }));
    return subdirs.get(sub);
  };

  return {
    async init() { dir = await openDir(); },
    exists(name, sub) {
      return locked(async () => {
        try { return (await (await (await dirFor(sub)).getFileHandle(name)).getFile()).size > 0; }
        catch { return false; }
      });
    },
    read(name, sub) {
      return locked(async () => {
        try { return await (await (await (await dirFor(sub)).getFileHandle(name)).getFile()).text(); }
        catch { return null; }
      });
    },
    write(name, text, sub) {
      return locked(async () => {
        let lastErr;
        const attempts = consecFails >= 3 ? 1 : MAX_RETRIES;
        for (let attempt = 0; attempt < attempts; attempt++) {
          let w;
          try {
            if (attempt > 0) {
              try { dir = await openDir(); subdirs.clear(); } catch {}
              /* a half-written or externally touched file can wedge every
                 rewrite attempt — drop it and recreate from scratch */
              if (attempt > 1) { try { await (await dirFor(sub)).removeEntry(name); } catch {} }
            }
            w = await (await (await dirFor(sub)).getFileHandle(name, { create: true })).createWritable();
            await w.write(text);
            await w.close();
            consecFails = 0;
            return;
          } catch (e) {
            lastErr = e;
            /* never leave a failed stream dangling: its open swap file keeps
               the handle in the stale "state changed" condition and can wedge
               every subsequent attempt on the same file */
            if (w) { try { await w.abort(); } catch {} }
            await new Promise(res => setTimeout(res, 500 * 2 ** attempt));
          }
        }
        consecFails++;
        throw lastErr;
      });
    },
    async finish() {},
  };
}

function triggerDownload(blob, filename) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

async function saveAsZip(folderName, files, zipName) {
  const zip = new JSZip();
  const folder = zip.folder(folderName);
  for (const f of files) folder.file(f.filename, f.body);
  triggerDownload(await zip.generateAsync({ type: "blob" }), zipName);
}

function zipSink(folderName) {
  const files = [];
  const path = (name, sub) => (sub ? `${sub}/${name}` : name);
  return {
    async init() {},
    async exists() { return false; },
    async read(name, sub) { return files.find(f => f.filename === path(name, sub))?.body ?? null; },
    async write(name, text, sub) { files.push({ filename: path(name, sub), body: text }); },
    async finish() {
      setStatus("Building ZIP…");
      await saveAsZip(folderName, files, `${folderName}.zip`);
    },
  };
}

/* helpers on the user-picked root folder: the per-slug title cache lives
   there, and a novel folder gets renamed once its title translation becomes
   available (copy + delete — the File System Access API can't rename dirs) */
function rootOps(rootHandle) {
  return {
    async read(name) {
      try { return await (await (await rootHandle.getFileHandle(name)).getFile()).text(); }
      catch { return null; }
    },
    async write(name, text) {
      const w = await (await rootHandle.getFileHandle(name, { create: true })).createWritable();
      await w.write(text);
      await w.close();
    },
    async renameMerge(oldName, newName) {
      let oldDir;
      try { oldDir = await rootHandle.getDirectoryHandle(oldName); } catch { return; }
      setStatus(`Renaming folder to "${newName}"…`);
      const copyInto = async (src, dst) => {
        for await (const [n, h] of src.entries()) {
          if (h.kind === "directory") {
            await copyInto(h, await dst.getDirectoryHandle(n, { create: true }));
          } else {
            let already = true;
            try { await dst.getFileHandle(n); } catch { already = false; }
            if (already) continue;  /* both exist: keep the existing file */
            const w = await (await dst.getFileHandle(n, { create: true })).createWritable();
            await w.write(await (await h.getFile()).arrayBuffer());
            await w.close();
          }
        }
      };
      await copyInto(oldDir, await rootHandle.getDirectoryHandle(newName, { create: true }));
      await rootHandle.removeEntry(oldName, { recursive: true });
      log(`Renamed folder "${oldName}" -> "${newName}"`);
    },
  };
}

/* ---------------- translation (Claude API) ---------------- */

const HAIKU = "claude-haiku-4-5";
const SONNET = "claude-sonnet-5";
const TRANSLATE_EFFORT = "medium";
const NAMES_CACHE_FILE = ".names_cache.json";
const GLOSSARY_PROGRESS_FILE = ".glossary_progress.json";
const TITLE_CACHE_FILE = ".title_cache.json";
const TRANSLATED_DIR = "translated";
const FETCH_BATCH = 50;                       // chapters fetched per Worker call (free-tier subrequest limit)
const TRANSLATE_MAX_BYTES = 50 * 1024 * 1024; // cap a translation batch's request body at ~50MB
/* Chapters are packed into each request up to this many estimated input tokens,
   so a combined-chapters request stays well under the model's 200K context. */
const CHUNK_TOKEN_BUDGET = 120000;
/* Conservative token estimate for Vietnamese text (~2 chars/token). Over-
   estimating keeps chunks safely below the context limit. */
const estTokens = s => Math.ceil(s.length / 2);

/* Split chapters into groups whose combined body stays within a token budget.
   A single oversized chapter still forms its own group. */
function chunkByTokens(chapters, budget) {
  const groups = [];
  let cur = [], curTok = 0;
  for (const ch of chapters) {
    const t = estTokens(ch.body || "");
    if (cur.length && curTok + t > budget) { groups.push(cur); cur = []; curTok = 0; }
    cur.push(ch); curTok += t;
  }
  if (cur.length) groups.push(cur);
  return groups;
}

/* The Message Batches endpoint is not CORS-enabled, so browser calls to
   api.anthropic.com are blocked. Route Claude API calls through the same
   Cloudflare Worker used for chapter fetching (server-to-server, no CORS) at
   the /anthropic/* path — see worker.js. */
async function apiFetch(path, body) {
  const url = `${PROXY}/anthropic/v1${path}`;
  const opts = {
    method: body ? "POST" : "GET",
    headers: {
      "content-type": "application/json",
      "x-api-key": $("apikey").value.trim(),
      "anthropic-version": "2023-06-01",
    },
    body: body ? JSON.stringify(body) : undefined,
  };
  let lastErr;
  for (let i = 0; i < MAX_RETRIES; i++) {
    let r;
    try {
      r = await fetch(url, opts);
    } catch (e) {
      /* network-level failure (offline, dropped connection, or a CORS block) —
         "Failed to fetch" lands here; retry a few times before giving up */
      lastErr = new Error(`network error calling ${path} — ${e.message}`);
      await sleepUnlessStopped(1000 * 2 ** i + Math.random() * 1000);
      continue;
    }
    if (r.ok) return r;
    lastErr = new Error(`Claude API ${r.status}: ${(await r.text()).slice(0, 300)}`);
    if (r.status !== 429 && r.status < 500) throw lastErr;   // client error — don't retry
    await sleepUnlessStopped(1000 * 2 ** i + Math.random() * 1000);
  }
  throw lastErr;
}

/* One long-poll: the Worker checks the batch every ~10s for up to ~90s and
   returns the moment it ends, so the browser makes ~1 status call per 90s of
   batch time instead of one every 30s. `useSignal` lets a Stop abort the
   in-flight wait immediately. */
async function pollBatch(batchId, useSignal) {
  let lastErr;
  for (let i = 0; i < MAX_RETRIES; i++) {
    try {
      const r = await fetch(`${PROXY}/anthropic-poll/${batchId}`, {
        headers: { "x-api-key": $("apikey").value.trim(), "anthropic-version": "2023-06-01" },
        signal: useSignal ? aborter?.signal : undefined,
      });
      if (r.ok) return r.json();
      lastErr = new Error(`poll HTTP ${r.status}`);
    } catch (e) {
      if (e.name === "AbortError") throw e;   // Stop pressed — don't retry
      lastErr = e;
    }
    await sleepUnlessStopped(1000 * 2 ** i + Math.random() * 1000);
  }
  throw lastErr;
}

/* submit a Message Batch, long-poll until it ends, return Map(custom_id → message).
   On Stop, the batch is canceled server-side; results that finished before the
   cancellation are still returned so paid-for work is kept. */
async function runBatch(requests, label) {
  throwIfStopped();
  const batch = await (await apiFetch("/messages/batches", { requests })).json();
  log(`[${label}] batch submitted (${requests.length} request${requests.length > 1 ? "s" : ""}); polling…`);
  let cancelSent = false;
  for (;;) {
    let b;
    try {
      b = await pollBatch(batch.id, !cancelSent);
    } catch (e) {
      if (e.name === "AbortError" && stopRequested) {
        if (!cancelSent) {
          cancelSent = true;
          try {
            await apiFetch(`/messages/batches/${batch.id}/cancel`, {});
            log(`[${label}] batch canceled — keeping results that already finished`, "err");
          } catch (ce) { log(`[${label}] cancel failed — ${errMsg(ce)}`, "err"); }
        }
        continue;   // keep polling (no abort signal) until the canceled batch ends
      }
      throw e;
    }
    const c = b.request_counts;
    setStatus(`[${label}] processing: ${c.processing}  ok: ${c.succeeded}  err: ${c.errored}`);
    if (b.processing_status === "ended") break;
  }
  const results = new Map();
  const text = await (await apiFetch(`/messages/batches/${batch.id}/results`)).text();
  for (const line of text.split("\n")) {
    if (!line.trim()) continue;
    const item = JSON.parse(line);
    if (item.result.type === "succeeded") results.set(item.custom_id, item.result.message);
    else log(`[${label}] ${item.custom_id}: ${item.result.type}`, "err");
  }
  return results;
}

const messageText = msg =>
  msg.content.filter(b => b.type === "text").map(b => b.text).join("").trim();

const jsonFormat = schema => ({ format: { type: "json_schema", schema } });
const chapterNum = filename => {
  const m = filename.match(/^Chapter (\d+)/);
  return m ? parseInt(m[1], 10) : null;
};

/* ---- novel folder name: "{English title} ({Vietnamese title})" ---- */

/* Read the title cache and normalize legacy shapes to { vietName, english }. */
async function readTitleCache(root) {
  let cache = {};
  if (root) { try { cache = JSON.parse(await root.read(TITLE_CACHE_FILE) ?? "{}") || {}; } catch {} }
  return cache;
}
function titleEntry(cache, slug, vietName) {
  let entry = cache[slug];
  if (typeof entry === "string") return { vietName, english: entry };            // very old
  if (entry && entry.translated !== undefined)                                   // legacy {name, translated}
    return { vietName, english: entry.translated ? entry.name : null };
  return entry || { vietName, english: null };
}

/* No LLM here — the title is translated later, in the batched translation
   phase. This just applies whatever's cached: if an English name is known but
   the folder on disk is still under the Vietnamese name (from an earlier run),
   rename it now, before the sink starts writing. */
async function resolveFolderName(root, slug, title) {
  const vietName = sanitize(title);
  const cache = await readTitleCache(root);
  const entry = titleEntry(cache, slug, vietName);
  const target = entry.english || vietName;
  if (root && entry.english && entry.english !== vietName) {
    try { await root.renameMerge(vietName, entry.english); }
    catch (e) { log(`folder rename failed — ${errMsg(e)}`, "err"); }
  }
  if (root) {
    cache[slug] = { vietName, english: entry.english || null };
    try { await root.write(TITLE_CACHE_FILE, JSON.stringify(cache, null, 2)); } catch {}
  }
  return target;
}

/* Persist an English title rendering so the next run renames the folder. */
async function saveEnglishTitle(root, slug, title, englishRaw) {
  const vietName = sanitize(title);
  const english = sanitize(`${englishRaw} (${title})`);
  const cache = await readTitleCache(root);
  cache[slug] = { vietName, english };
  try { await root.write(TITLE_CACHE_FILE, JSON.stringify(cache, null, 2)); } catch {}
  return english;
}

/* ---- chapter translation into the translated/ subfolder ---- */

/* The glossary is an array of [Vietnamese, English] pairs on disk (one pair
   per line); in memory it's a Map keyed by the (unique) Vietnamese term.
   English may repeat. */
async function loadGlossary(sink) {
  const map = new Map();
  try {
    const raw = JSON.parse(await sink.read(NAMES_CACHE_FILE) ?? "null");
    if (Array.isArray(raw)) {
      for (const p of raw) {
        if (Array.isArray(p) && p.length >= 2) map.set(String(p[0]), String(p[1]));
        else if (p && p.vietnamese) map.set(String(p.vietnamese), String(p.english ?? ""));  // legacy objects
      }
    } else if (raw && typeof raw === "object") {           // legacy {vi: en} object
      for (const [k, v] of Object.entries(raw)) map.set(k, String(v));
    }
  } catch {}
  return map;
}
/* sorted alphabetically by the Vietnamese term (vi locale for diacritics) */
const glossaryPairs = map => [...map].sort((a, b) => a[0].localeCompare(b[0], "vi"));
const saveGlossary = (sink, map) =>
  sink.write(NAMES_CACHE_FILE,
    "[\n" + glossaryPairs(map).map(p => "  " + JSON.stringify(p)).join(",\n") + "\n]");

/* Which chapter filenames have already been folded into the glossary, so a
   resumed run only extracts names from the chapters it hasn't reached yet. */
async function loadGlossaryProgress(sink) {
  try { const a = JSON.parse(await sink.read(GLOSSARY_PROGRESS_FILE) ?? "[]"); return new Set(Array.isArray(a) ? a : []); }
  catch { return new Set(); }
}
const saveGlossaryProgress = (sink, set) =>
  sink.write(GLOSSARY_PROGRESS_FILE, JSON.stringify([...set].sort(), null, 2));

async function translateTitleBatch(title) {
  const results = await runBatch([{
    custom_id: "title",
    params: {
      model: HAIKU,
      max_tokens: 100,
      messages: [{ role: "user", content:
        "Translate this Vietnamese novel title to natural English. Reply with ONLY the translated title, nothing else:\n" + title }],
    },
  }], "title");
  const tm = results.get("title");
  return tm ? messageText(tm) : null;
}

const PAIRS_SCHEMA = jsonFormat({
  type: "object",
  properties: {
    pairs: {
      type: "array",
      items: {
        type: "object",
        properties: { vietnamese: { type: "string" }, english: { type: "string" } },
        required: ["vietnamese", "english"],
        additionalProperties: false,
      },
    },
  },
  required: ["pairs"],
  additionalProperties: false,
});

const GLOSSARY_SYSTEM =
  "You are building a proper-noun glossary for an English translation of a Vietnamese web novel. From the chapters given, find every proper name — characters, nicknames, places, sects/organizations, techniques, titles, brands — and give the English rendering to use consistently throughout the translation. Romanize person names in the conventional form for the name's likely origin: most are Sino-Vietnamese, so use the standard pinyin-style English rendering (e.g. \"Tiêu Viêm\" -> \"Xiao Yan\", \"Đấu Khí\" -> \"Dou Qi\"), not a diacritic-stripped copy. Translate meaningful place/organization/technique names. Reuse the existing glossary's renderings exactly and only return names that are NOT already in it. Return an array of {vietnamese, english} pairs; each Vietnamese term appears once.";

/* Build the per-novel proper-noun glossary via the Batch API. Chapters are
   packed into groups by estimated token count (so a group's combined text
   stays under the model's 200K context), and each group is sent as one big
   text blob in its own single-request batch. The batches run SEQUENTIALLY and
   each one is given the pairs accumulated from all earlier batches — so a name
   rendered in the first group is reused verbatim for every later group. Pairs
   are merged with unique-Vietnamese dedup (existing wins). Full chapter text in
   each request is what lets Sino-Vietnamese names romanize properly
   (e.g. "Tiêu Viêm" -> "Xiao Yan") instead of just losing their accents.
   `wantTitle` (the raw Vietnamese title, or null) folds a one-shot title
   translation into the first batch so it, too, goes through the Batch API.

   A batch that fails (after apiFetch's retries) is NOT skipped — it aborts the
   whole build by throwing. Every completed batch is already saved, and the set
   of glossary-covered chapters is persisted after each one, so the next run
   resumes from the first chapter that hasn't been covered yet. */
async function buildGlossary(sink, pending, wantTitle) {
  const glossary = await loadGlossary(sink);
  const done = await loadGlossaryProgress(sink);
  if (!glossary.size) done.clear();   // glossary was cleared/deleted -> rebuild from scratch
  const todo = pending.filter(ch => !done.has(ch.filename));
  const groups = chunkByTokens(todo, CHUNK_TOKEN_BUDGET);
  let englishTitle = null;

  if (!groups.length) {
    if (done.size) log(`Glossary already covers all ${pending.length} pending chapter(s)`, "ok");
    if (wantTitle) englishTitle = await translateTitleBatch(wantTitle);
    return { glossary, englishTitle };
  }

  log(`Building name glossary for ${todo.length} chapter(s)`
    + (done.size ? ` (${done.size} already covered)` : "")
    + ` in ${groups.length} sequential batch(es)`);

  for (let gi = 0; gi < groups.length; gi++) {
    throwIfStopped();
    setStatus(`Building glossary: batch ${gi + 1}/${groups.length}…`);
    const blob = groups[gi]
      .map(ch => `=== ${ch.filename.replace(/\.txt$/, "")} ===\n${ch.body}`)
      .join("\n\n");
    const reqs = [{
      custom_id: "glossary",
      params: {
        model: HAIKU,
        max_tokens: 8000,
        system: [{ type: "text", text: GLOSSARY_SYSTEM, cache_control: { type: "ephemeral" } }],
        messages: [{
          role: "user",
          content: "EXISTING GLOSSARY, as [Vietnamese, English] pairs (reuse exactly; do not repeat these in your answer):\n"
            + JSON.stringify(glossaryPairs(glossary)) + "\n\nCHAPTERS:\n" + blob,
        }],
        output_config: PAIRS_SCHEMA,
      },
    }];
    if (gi === 0 && wantTitle) reqs.push({
      custom_id: "title",
      params: {
        model: HAIKU,
        max_tokens: 100,
        messages: [{ role: "user", content:
          "Translate this Vietnamese novel title to natural English. Reply with ONLY the translated title, nothing else:\n" + wantTitle }],
      },
    });

    /* runBatch (via apiFetch) already retries network/429/5xx with backoff;
       if it still fails, let it throw — earlier batches and the progress
       record below are already saved, so a re-run resumes from here. */
    const results = await runBatch(reqs, `glossary ${gi + 1}/${groups.length}`);
    if (gi === 0 && wantTitle) { const tm = results.get("title"); if (tm) englishTitle = messageText(tm); }

    let added = 0;
    const gm = results.get("glossary");
    let pairs = [];
    if (gm) { try { pairs = JSON.parse(messageText(gm)).pairs; } catch {} }
    for (const { vietnamese, english } of pairs) {
      const vi = String(vietnamese ?? "").trim(), en = String(english ?? "").trim();
      if (vi && en && !glossary.has(vi)) { glossary.set(vi, en); added++; }
    }
    for (const ch of groups[gi]) done.add(ch.filename);
    await saveGlossary(sink, glossary);
    await saveGlossaryProgress(sink, done);
    log(`Glossary batch ${gi + 1}/${groups.length}: +${added} names (${glossary.size} total)`, "ok");
  }
  return { glossary, englishTitle };
}

/* Translate pending chapters into translated/, keeping the same filenames as
   their sources so re-runs can skip what's already done. Builds the glossary
   (sequential batches) first, then translates all pending chapters in one
   parallel batch with the glossary pairs included. Each chapter is written as
   the batch results are read, so re-running resumes from the first missing
   chapter. `ctx` carries {root, slug, title} for the batched title translation. */
async function translateNovel(sink, chapters, ctx = {}) {
  const pending = [];
  for (const ch of chapters) {
    if (await sink.exists(ch.filename, TRANSLATED_DIR)) continue;
    const body = ch.body ?? await sink.read(ch.filename);
    if (body) pending.push({ filename: ch.filename, body });
  }
  if (!pending.length) { log("Translation: everything already translated.", "ok"); return; }

  /* translate the folder title (via the Batch API, folded into the glossary)
     only if we have a writable root and it isn't already translated */
  let wantTitle = null;
  if (ctx.root && ctx.title) {
    const entry = titleEntry(await readTitleCache(ctx.root), ctx.slug, sanitize(ctx.title));
    if (!entry.english) wantTitle = ctx.title;
  }

  log(`Translating ${pending.length} chapter(s) with ${SONNET} (effort=${TRANSLATE_EFFORT}, Batches API)`);
  const { glossary, englishTitle } = await buildGlossary(sink, pending, wantTitle);
  if (englishTitle && ctx.root) {
    const eng = await saveEnglishTitle(ctx.root, ctx.slug, ctx.title, englishTitle);
    log(`Title translated — folder will be renamed to "${eng}" on the next run.`, "ok");
  }
  throwIfStopped();

  const system = [{
    type: "text",
    text: "Translate this Vietnamese web novel chapter into natural, fluent English.\nRules:\n- Use EXACTLY these English renderings for proper names (array of [Vietnamese, English] pairs):\n"
      + JSON.stringify(glossaryPairs(glossary))
      + "\n- Preserve paragraph breaks (blank line between paragraphs).\n- Output ONLY the translated chapter text: no chapter title, no headers, no notes, no commentary.",
    cache_control: { type: "ephemeral" },
  }];

  /* pack chapters into batches so each batch's request body stays under
     TRANSLATE_MAX_BYTES (the glossary system prompt is repeated per request);
     for a normal-size novel this is a single batch, splitting only when huge */
  const enc = new TextEncoder();
  const sysBytes = enc.encode(JSON.stringify(system)).length;
  const batches = [];
  {
    let cur = [], curB = 0;
    for (const ch of pending) {
      const b = sysBytes + enc.encode(ch.body).length + 400;
      if (cur.length && curB + b > TRANSLATE_MAX_BYTES) { batches.push(cur); cur = []; curB = 0; }
      cur.push(ch); curB += b;
    }
    if (cur.length) batches.push(cur);
  }
  log(`Translating ${pending.length} chapter(s) in ${batches.length} batch(es)`
    + (batches.length > 1 ? ` (≤ ${Math.round(TRANSLATE_MAX_BYTES / 1048576)}MB each)` : ""));

  let saved = 0, failed = 0;
  for (let bi = 0; bi < batches.length && !stopRequested; bi++) {
    const group = batches[bi];
    const results = await runBatch(group.map((ch, i) => ({
      custom_id: `ch-${i}`,
      params: {
        model: SONNET,
        max_tokens: 32000,
        output_config: { effort: TRANSLATE_EFFORT },
        system,
        messages: [{ role: "user", content: ch.body }],
      },
    })), batches.length > 1 ? `translate ${bi + 1}/${batches.length}` : "translate");

    for (let i = 0; i < group.length; i++) {
      const msg = results.get(`ch-${i}`);
      /* a truncated translation is incomplete — leave it unsaved so the next
         run retries it */
      if (msg && msg.stop_reason === "max_tokens") {
        log(`! ${group[i].filename}: output truncated (max_tokens); not saved`, "err");
        failed++;
        continue;
      }
      const text = msg ? messageText(msg) : "";
      if (!text) { failed++; continue; }
      try {
        await sink.write(group[i].filename, text, TRANSLATED_DIR);
        saved++;
        log(`saved  ${TRANSLATED_DIR}/${group[i].filename}`, "ok");
      } catch (e) {
        failed++;
        log(`SAVE FAILED ${TRANSLATED_DIR}/${group[i].filename} — ${errMsg(e)}`, "err");
      }
    }
  }
  log(`Translation ${stopRequested ? "stopped" : "done"}: ${saved} ok, ${failed} failed`
    + (failed || stopRequested ? " (re-run to resume the rest)" : ""), failed ? "err" : "ok");
}

/* ---------------- main flow ---------------- */

async function run(makeSink, root = null) {
  if (running) return;
  const novelUrl = $("url").value.trim();
  const concurrency = Math.max(1, Math.min(10, parseInt($("conc").value, 10) || 5));
  if (!NOVEL_URL_RE.test(novelUrl)) {
    setStatus("Enter a novel URL starting with https://truyenfull.today");
    return;
  }
  const translate = $("translate").checked;
  if (translate && !$("apikey").value.trim()) {
    setStatus("Enter your Anthropic API key to translate.");
    return;
  }

  running = true;
  stopRequested = false;
  aborter = new AbortController();
  $("btn-stop").disabled = false;
  updateButtons();
  logEl.textContent = "";
  bar.style.display = "block";
  bar.value = 0;

  try {
    setStatus("Listing chapters…");
    const { title, chapters } = await listAllChapters(novelUrl);
    if (!chapters.length) throw new Error("no chapters found — site layout may have changed");
    log(`${title} — ${chapters.length} chapters, fetch concurrency ${concurrency} (v${VERSION})`);
    const slug = slugOf(novelUrl.replace(/\/+$/, "") + "/");
    const folderName = await resolveFolderName(root, slug, title);
    log(`Saving to: ${folderName}/`);

    const sink = await makeSink(folderName);
    await sink.init();

    let done = 0, saved = 0, skipped = 0;
    const failed = [];
    bar.max = chapters.length;

    const pendingSaves = [];
    const collected = [];
    const status = () => setStatus(`${done}/${chapters.length} done (${saved} saved, ${skipped} skipped, ${failed.length + pendingSaves.length} failed)`);

    /* skip already-downloaded chapters without any fetch (filename predicted
       from the URL number + link text) */
    const toFetch = [];
    for (const ch of chapters) {
      const preName = predictedName(ch);
      if (preName && await sink.exists(preName)) {
        collected.push({ filename: preName, body: null });
        skipped++; bar.value = ++done;
        log(`skip   ${preName}`);
      } else {
        toFetch.push(ch);
      }
    }
    status();

    /* fetch the rest in groups of up to FETCH_BATCH via one Worker call each */
    for (let i = 0; i < toFetch.length && !stopRequested; i += FETCH_BATCH) {
      const group = toFetch.slice(i, i + FETCH_BATCH);
      setStatus(`Fetching chapters ${i + 1}-${Math.min(i + FETCH_BATCH, toFetch.length)} of ${toFetch.length}…`);
      let htmls;
      try { htmls = await fetchMany(group.map(c => c.url), concurrency); }
      catch (e) {
        if (stopRequested) break;
        for (const ch of group) { failed.push(ch.url); log(`DOWNLOAD FAILED ${ch.url} — ${errMsg(e)}`, "err"); bar.value = ++done; }
        status();
        continue;
      }
      for (const ch of group) {
        try {
          const html = htmls.get(ch.url);
          if (!html) throw new Error("fetch failed");
          const { filename, body } = parseChapter(new DOMParser().parseFromString(html, "text/html"), ch);
          collected.push({ filename, body });
          if (await sink.exists(filename)) { skipped++; log(`skip   ${filename}`); }
          else {
            try { await sink.write(filename, body); saved++; log(`saved  ${filename}`, "ok"); }
            catch (e) {
              pendingSaves.push({ url: ch.url, filename, body });
              log(`SAVE FAILED ${filename} — ${errMsg(e)} (will retry at the end)`, "err");
            }
          }
        } catch (e) {
          failed.push(ch.url);
          log(`DOWNLOAD FAILED ${ch.url} — ${errMsg(e)}`, "err");
        }
        bar.value = ++done;
        status();
      }
    }

    /* chapters that downloaded but would not save: retry one by one now
       that no other writes are in flight */
    const rescued = [];
    for (let i = 0; i < pendingSaves.length; i++) {
      const p = pendingSaves[i];
      setStatus(`Retrying failed saves… ${i + 1}/${pendingSaves.length}`);
      try { await sink.write(p.filename, p.body); saved++; log(`saved  ${p.filename} (retry)`, "ok"); }
      catch (e) { rescued.push(p); log(`SAVE FAILED ${p.filename} — ${errMsg(e)}`, "err"); }
    }

    /* last resort: the content is already downloaded, so never drop it —
       hand it over as a ZIP, which bypasses folder writes entirely */
    if (rescued.length) {
      setStatus("Folder saves failed — building rescue ZIP…");
      await saveAsZip(folderName, rescued, `${folderName} - rescued chapters.zip`);
      log(`\n${rescued.length} chapter(s) would not save to the folder — they were downloaded as "${folderName} - rescued chapters.zip" instead.`, "err");
      log(`If folder saving keeps failing: check Windows Security → Ransomware protection → "Controlled folder access" (it silently blocks Chrome from writing), and note that Desktop/Documents folders are often OneDrive-synced by default even when they look local.`);
    }

    if (translate && collected.length && !stopRequested) {
      collected.sort((a, b) => (chapterNum(a.filename) ?? 1e9) - (chapterNum(b.filename) ?? 1e9));
      try { await translateNovel(sink, collected, { root, slug, title }); }
      catch (e) {
        if (e.stopped) { log("Translation stopped by user.", "err"); }
        else {
          log(`TRANSLATION FAILED — ${errMsg(e)}`, "err");
          if (/network error|Failed to fetch/i.test(e.message))
            log("A network error reached the Claude API. Downloaded chapters and any glossary/translations so far are saved — re-run to resume. If it keeps failing, open DevTools (F12) → Console: a line mentioning \"CORS policy\" means the Batches endpoint is blocking direct browser calls, anything else is a plain network drop.", "err");
        }
      }
    }

    await sink.finish();
    setStatus(`${stopRequested ? "Stopped" : "Done"}: ${saved} saved, ${skipped} skipped, ${failed.length} failed`
      + (rescued.length ? `, ${rescued.length} rescued to ZIP.` : "."));
    if (stopRequested) log("Stopped — re-run to resume where you left off.", "err");
    if (failed.length) log(`\nRe-run to retry the ${failed.length} failed chapter(s).`, "err");
  } catch (e) {
    setStatus(e.stopped ? "Stopped." : `Error: ${e.message}`);
  } finally {
    running = false;
    stopRequested = false;
    updateButtons();
  }
}

$("btn-folder").addEventListener("click", async () => {
  let root;
  try { root = await showDirectoryPicker({ mode: "readwrite" }); }
  catch { return; /* user canceled */ }
  run(folderName => folderSink(root, folderName), rootOps(root));
});

$("btn-zip").addEventListener("click", () => run(folderName => zipSink(folderName)));
</script>
</body>
